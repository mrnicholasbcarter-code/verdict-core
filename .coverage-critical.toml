# Critical module branch coverage floors
# These thresholds prevent regression in safety-critical modules.
# Each floor is the measured branch coverage at BOD-196 baseline, rounded down to nearest 5%.
# Run: scripts/check_critical_coverage.py after pytest --cov=verdict --cov-branch --cov-report=xml

[critical_modules."verdict/availability_cache.py"]
branch_coverage_floor = 65
measured_at_baseline = 66.67

[critical_modules."verdict/contracts.py"]
branch_coverage_floor = 80
measured_at_baseline = 80.40

[critical_modules."verdict/eligibility.py"]
branch_coverage_floor = 85
measured_at_baseline = 88.24

[critical_modules."verdict/orchestration/orchestration/contracts.py"]
branch_coverage_floor = 75
measured_at_baseline = 77.14

[critical_modules."verdict/orchestration/orchestration/eligibility.py"]
branch_coverage_floor = 85
measured_at_baseline = 89.34

[critical_modules."verdict/orchestration/orchestration/executors.py"]
