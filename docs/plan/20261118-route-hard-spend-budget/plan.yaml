plan_id: '20261118-route-hard-spend-budget'
status: pending
tldr: |
  Wire the public route budget to execution-path authority and prove BOD-432 A25
  through structured, opt-in diagnostics on the installed public route.
created_at: '2026-11-18'
created_by: gem-planner
revision: 1
replan_count: 0
planner_revision_used: false
decisions:
  - 'OpenSpec change: bod-432-public-route-hard-spend-budget; add a route-selection delta before coding.'
  - Reuse execution-path qualification. Hard budget rejects unknown cash with unknown_price_not_treated_as_free; no budget leaves unknown pricing advisory.
  - Use POST /v1/route?include_routing_trace=true to return a per-request routing_trace without changing the legacy response shape or relying on a subsequent explain lookup.
  - The trace is a read-only projection of real stage outputs, not a new admission or optimizer path. Expose candidate IDs, outcome and rejection codes, not evidence payloads or secrets.
  - A25 invariance applies when budget eligibility is unchanged; crossing the hard ceiling is a separate negative control.
assumptions:
  - Live proof requires the operator's installed merged-main runtime, consent, and an evidenced non-pay-per-token probe route; otherwise stop and record blocked.
  - Prior captures at c04e3e61 are baseline evidence only, not a pass or a source of credentials.
