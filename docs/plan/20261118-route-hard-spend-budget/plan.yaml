risks:
  - Public input and output contracts can regress legacy clients; opt in to diagnostics and test unchanged legacy shape/status.
  - Stage diagnostics can misrepresent authority; capture once from the same request and never infer from the winner or prose.
  - Live evidence drift or a confirm probe can invalidate comparisons or incur spend; hold evidence constant and stop on stale proof or uncertain billing.
live_acceptance_commands: |
  # Run with bash after consent and provenance checks, outside automated tests.
  # INPUT contains reviewed cases; OUT is a new private evidence directory.
  # auth.cfg is an operator-provided private curl config containing only the auth header.
  set -euo pipefail
  umask 077
  verdict doctor > "$OUT/doctor.txt"
  for c in base label-only price-only priced-budget noprice-budget noprice invalid legacy; do
    url=http://127.0.0.1:8000/v1/route
    if [ "$c" != legacy ]; then url="$url?include_routing_trace=true"; fi
    VERDICT_LIVE_SMOKE=1 curl --config "$AUTH_CFG" --silent --show-error --max-time 150 \
      -H 'Content-Type: application/json' --data-binary "@$INPUT/$c.json" \
      --output "$OUT/$c.json" --write-out '%{http_code}\n' "$url" > "$OUT/$c.status"
  done
  for c in base label-only price-only; do
    test "$(cat "$OUT/$c.status")" = 200
    jq -eS '.routing_trace as $t | select(($t.admitted_candidate_ids | length) >= 2 and ($t.shortlist_candidate_ids | length) >= 2 and $t.optimizer_decision.selected_candidate_id != null and .model != null) | [($t.admitted_candidate_ids | sort), $t.shortlist_candidate_ids, $t.optimizer_decision, .provider, .model]' "$OUT/$c.json" > "$OUT/$c.comparison.json"
  done
  diff -u "$OUT/base.comparison.json" "$OUT/label-only.comparison.json"
  diff -u "$OUT/base.comparison.json" "$OUT/price-only.comparison.json"
  for c in priced-budget noprice-budget; do
    if [ "$c" = priced-budget ]; then id="$PRICED_ID"; code=exceeds_hard_spend_budget; else id="$UNPRICED_ID"; code=unknown_price_not_treated_as_free; fi
    jq -e --arg id "$id" --arg code "$code" '.routing_trace | (.rejected_offers | any(.candidate_id == $id and .code == $code)) and (.optimizer_decision.selected_candidate_id != $id)' "$OUT/$c.json"
  done
  test "$(cat "$OUT/noprice.status")" = 200
  jq -e --arg id "$UNPRICED_ID" '.routing_trace.optimizer_decision.selected_candidate_id == $id' "$OUT/noprice.json"
  test "$(cat "$OUT/invalid.status")" = 400
  jq -e 'tostring | contains("execution_path_request.hard_spend_budget")' "$OUT/invalid.json"
  test "$(cat "$OUT/legacy.status")" = 200
  jq -e 'has("routing_trace") | not' "$OUT/legacy.json"
