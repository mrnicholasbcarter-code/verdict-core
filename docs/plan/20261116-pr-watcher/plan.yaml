plan_id: 20261116-pr-watcher
status: pending
tldr: |
  Deliver the BOD-358 PR watcher as a deterministic exact-head controller handoff:
  move reusable CI policy into verdict/ci_policy.py, reconcile open and recently
  merged PRs, fence bounded reruns by stable check identity, persist idempotent
  repair/block/regression records, and install a <=5 minute setup/doctor timer.
created_at: '2026-11-16T00:00:00Z'
created_by: gem-planner
revision: 2
replan_count: 0
planner_revision_used: false
decisions:
  - 'Scope is limited to the PR-watcher slice; broader BOD-358 watchers remain excluded.'
  - 'Move classify_ci, classify_merge_state, ci_recovery_action, and INFRA_PATTERNS to verdict/ci_policy.py; scripts/prime_state.py re-exports them for compatibility because production code must not import scripts.'
  - 'Use GitHub closed+merged PR search/list with a durable bounded lookback cursor to reconcile merged regressions in addition to open-PR polling.'
  - 'Stable rerun identity is repo + PR number + exact head SHA + check name + workflow/job identity; counter updates are atomic and fenced by an immediate exact-head/check reread.'
  - 'The watcher client is capability-restricted: it exposes read, rerun, and notification operations only, never merge, push, branch, or source-edit operations.'
  - 'All watcher invocations use a non-blocking flock single-writer lock under the common verdict-prime state directory; durable idempotency keys cover repair, block, regression, digest, and Linear events.'
  - 'Core, host, tests, and OpenSpec ownership are disjoint; host edits are limited to exact files and are sequenced after core interfaces exist.'
  - 'Action mapping: the adapter table in specs/pr-watcher/spec.md is normative; this file does not restate it.'
  - 'Agent labels are capability hints; tasks that write application or test code are dispatched to gem-implementer.'
assumptions:
  - 'Existing GitHub and Linear authentication/client patterns can be reused without new dependencies.'
  - 'The common verdict-prime state directory is available to the watcher and controller.'
  - 'Configured repositories are allowlisted under github.com/mrnicholasbcarter-code.'
  - 'Existing setup and doctor abstractions remain the host integration boundary.'
  - 'The implementation branch is /home/nick/dev/verdict-core-worktrees/pr-watcher at the requested base commit.'
shared_context:
  watcher_contract:
    - 'OpenSpec: openspec/changes/bod358-pr-watcher/{proposal.md,design.md,tasks.md,specs/pr-watcher/spec.md}'
    - 'Policy boundary: verdict/ci_policy.py is importable production authority; scripts/prime_state.py is a compatibility re-export.'
    - 'Regression source: closed+merged GitHub PRs since durable cursor with bounded lookback; fail review is CHANGES_REQUESTED or recorded Verdict/ocr fail receipt keyed by repo, PR, and head.'
    - 'Safety: no merge, push, branch mutation, or source edit; default tests fixture-only; live smoke requires VERDICT_LIVE_SMOKE=1.'
    - 'Concurrency: non-blocking flock and atomic durable state; duplicate events are suppressed by stable idempotency keys.'
    - 'Timer boundary: verdict setup installs/enables user timer; verdict doctor reports state and redacted provenance.'
    - 'Action mapping: the adapter table in specs/pr-watcher/spec.md is normative; this file does not restate it.'
