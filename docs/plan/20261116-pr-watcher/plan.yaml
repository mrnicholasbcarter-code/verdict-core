  - id: implement-pr-watcher-core
    title: Implement policy boundary and exact-head watcher core
    description: '[reuse] Add verdict/ci_policy.py and compatibility re-exports, then implement watcher state, polling, merged-PR reconciliation, capability-restricted GitHub adapter, stable rerun fencing, flock serialization, durable records, and core fixture tests. No host files or OpenSpec files.'
    wave: 2
