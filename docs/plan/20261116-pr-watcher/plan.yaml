    context_cluster: watcher_contract
    owned_files: ['verdict/ci_policy.py', 'scripts/prime_state.py', 'verdict/pr_watcher.py', 'verdict/pr_watcher_state.py', 'verdict/pr_watcher_github.py', 'verdict/pr_watcher_notifications.py', 'tests/test_ci_policy.py', 'tests/test_pr_watcher.py', 'tests/fixtures/pr_watcher/**']
    acceptance_criteria:
      - 'Production imports policy only from verdict/ci_policy.py; scripts/prime_state.py re-exports all four named symbols and existing callers/tests remain compatible; mypy --strict and reachability pass for new symbols.'
      - 'Open PR polling uses exact-head checks and merge state; zero, unknown, pending, cancelled, and >30 minute stalled checks are never green.'
      - 'Merged reconciliation reads closed+merged PRs since a durable cursor with bounded lookback and identifies fail review via CHANGES_REQUESTED or a keyed Verdict/ocr fail receipt; fixture covers open at run N and merged fail before N+1.'
      - 'Rerun key is repo + PR number + head SHA + check name + workflow/job identity; counters update atomically, immediate reread fences head/check, duplicate timers and concurrent requests do not duplicate reruns, and changed heads are rejected.'
      - 'GREEN / PROCEED_MERGE -> READY, no side effect; PENDING / WAIT_CI -> no action; INFRA_FAILURE / CANCELLED / stalled (>30m) / RETRY_CI -> one bounded rerun per key; CODE_FAILURE / CORRECTIVE_IMPLEMENTATION, CONFLICT / BEHIND / REBASE_AND_REPROOF -> durable controller repair record; EMPTY / MISSING_REQUIRED -> not green, repair record with reason; attempts exhausted / BLOCKED -> BLOCKED with reason, with no merge/push/branch/source-edit capability exposed to the watcher.'
      - 'Non-blocking flock serializes writers; repair, block, regression, digest, and Linear events have stable idempotency keys and atomic persistence.'
      - 'Fixtures cover multiple checks, changed head, duplicate timer, concurrent invocation, retry exhaustion, regression, and negative capability.'
    handoff:
      constraints: ['No setup, doctor, command registry, docs, or OpenSpec edits.', 'No live provider calls in default tests.']
      relevant_context: ['OpenSpec exact-head, bounded recovery, and transition requirements.']
      high_risk_signals: ['State integrity, merged-PR visibility, and package boundary.']
