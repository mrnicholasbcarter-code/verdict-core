plan_id: 20261117-dynamic-model-selection
status: pending
tldr: |
  Replace hardcoded model choices in Verdict's goal -> plan -> DAG -> workers -> review -> receipt loop
  and the operator's swarm scripts with one role-aware ladder:
    inventory -> hard eligibility/admission (canonical admitted set, unchanged)
      -> role narrowing (capacity, quota, pool, family; may only remove)
      -> advisory ordering (external strength x measured reliability; may only reorder)
  with an immutable candidate-set hash at every boundary. Roles: planner, implementer, reviewer,
  escalation, controller. The strength source reuses verdict/metadata (OpenRouter /api/v1/models
  benchmarks.artificial_analysis, the Artificial Analysis free API, models.dev).
  First slice (wave 2): a read-only, fail-closed ladder library plus
  `verdict ladder --role planner --json` and a deterministic shadow record. It changes no defaults,
  dispatch, reviewer/controller wiring, quota handling or operator files.
  Later waves add: all roles and reliability, then capacity evidence, then quota sharing, then
  dispatch behind VERDICT_DYNAMIC_SELECTION=on, then swarm wiring and live checks.
  Pass conditions are about provenance and policy, never a named model. cc/claude-fable-5-2 is the
  expected top planner today; it is not the test.
created_at: "2026-11-17"
created_by: gem-planner
revision: 3
replan_count: 0
planner_revision_used: true

decisions:
  - "Pipeline and hashes: four stages with a sha256 over the sorted canonical route ids leaving each stage (H0 inventory, H1 admitted, H2 narrowed, H3 ordered). Invariant: set(H3) == set(H2) and set(H2) is a subset of set(H1). Any violation fails closed with reason candidate_set_violation. Enforced in T3 and re-tested by every later task."
  - "Strength and reliability are advisory: consumed only through verdict/decision_signals advise_order/AdvisoryRanker. They never admit, never re-admit, never change membership (ADR 0001; tests/test_decision_signals_advisory.py TestAdvisoryRanker)."
  - "Smallest first slice ships first (critic item 11): T3 is read-only. It uses the canonical admitted set, the existing capacity.classify() output, the existing provider_catalog pools and the existing metadata strength. Nothing it does changes dispatch."
  - "Controller is a first-class role (critic item 5). Its ladder decides which route the harness root should run. It is also the fence: worker, reviewer and escalation ladders exclude the controller's served route and, under quota pressure, give way to it. CONTROLLER_MODEL(S) constants become legacy-only."
  - "Flag VERDICT_DYNAMIC_SELECTION=off|shadow|on, default off. off = strict legacy compatibility (identical selection algorithm and defaults), with one declared exception: the BOD-342 D22 lift (operator 2026-11-17), which is a policy change in every mode. shadow = legacy dispatch plus a side-effect-free dynamic computation recorded as a versioned event. on = dynamic, failing closed on a missing or empty ladder. off is permanent: it is the emergency fail-safe and the T11 rollback, and it is never removed. T12 may delete a legacy constant only when off no longer reads it."
  - "Entry points: POST /v1/route, /v1/chat/completions and /v1/responses relay, and the `verdict route` CLI Gate are out of scope and unchanged in all modes (they keep execution-path authority and catalog truth). In scope: `verdict orchestrate` (planner, implementer, reviewer, escalation per node), `verdict autodev` (planner via decomposer, executor), worker spawns through subagent_selection/worker_runtime (implementer, controller fence), and the new `verdict ladder` CLI (read-only in all modes)."
  - "Capacity: classify() keeps its D7 output (operator ruling, cheapest-proven-selection-s1). The plan adds capacity_confidence (observed | declared | assumed). The ladder treats assumed FREE as free only for implementer nodes of low risk with a fresh agentic passport. For planner, reviewer, controller and escalation, assumed FREE counts as UNKNOWN, which ranks last and is never healthy. A first 402 flips it to METERED (existing billing_402_metered). This keeps D7 for legacy callers without letting absence of evidence carry critical roles."
  - "One route per quota pool in every ladder (backend_pool/aliased_pools_for). Two models on one subscription are never two rungs: they fail together under one usage limit."
  - "Reviewer independence: hard for protected or high-risk work. If no route from a distinct family and a distinct pool exists, the review fails closed with reviewer_independence_unavailable. For low/medium risk it falls back to a distinct pool of the same family, with receipt reason reviewer_same_family_fallback. A same-pool reviewer is never allowed."
  - "Measured demotion replaces name exclusions (Mistral/Codestral, devstral, Qwen3.8-27B). Until measured demotion covers a model, the operator's list moves to a logged override file read by `verdict ladder` (operator override disposition). It is never a regex in code."
  - "File ownership never overlaps inside a wave. T6 (quota) waits for T5 and implements the QuotaView protocol frozen by T3, so it adds verdict/quota_share.py without editing role_selection.py."
  - "Agents: code tasks start on gem-implementer, which the orchestrator pins to kilocode/nvidia/nemotron-3-ultra-550b-a55b:free. On failure they escalate to Opus (omniroute/cc/claude-opus-5-5), then gem-implementer-fable (escalation/fable-first). Never Mistral or Codestral. Research, docs and devops run on the free tier. gem-reviewer tasks must be served by a family different from the served author model (checked from call logs)."
  - "Swarm files (~/bin/freescan-ladder, ~/.config/opencode/opencode.json, instructions/model-ladder.md) are operator-owned. Verdict never writes them. T11 changes them only with operator approval, consuming `verdict ladder --json`."

assumptions:
  - "OmniRoute GET /v1/models, connection/provider rows with plan/pricing/auth fields, and GET /api/usage/call-logs (status, requested model, served model, connection, error, timestamps) exist as freescan-ladder already uses. T1 confirms the exact fields and lookback limit."
  - "OpenRouter /api/v1/models keeps benchmarks.artificial_analysis unauthenticated (parsed in verdict/metadata/sources.py). The AA free API is reachable without a paid key; if it is not, the OpenRouter-mirrored AA fields are the only external score."
  - "The research agent's capacity facts (OpenCode Go METERED via apikey_positive_pricing; Kilo Code oauth SUBSCRIPTION with 2 x HTTP 402; Gemini Pro g1-pro-tier blocked by Google sign-in verification; ovhfree/kilofree keyless and absent from verdict eligibility) are unconfirmed until T1."
  - "health_cache.py's fcntl-locked JSON store (writers take LOCK_EX) is the model for atomic shared quota state."
  - "There is no repo pre-commit hook (only .git/hooks/pre-push -> vgate). Commits of plan files run vgate only on push."

pipeline_contract: |
  Stage S0 inventory: live /v1/models rows (or a fixture labelled fixture=true). Output H0.
  Stage S1 admission: the existing admission ladder and eligibility floors (verdict/admission.py,
    eligibility.py, orchestration/eligibility.py). Opaque auto/* and combo/* are removed here,
    unknown runtime is never healthy. Output canonical AdmittedSet, H1. Dynamic selection never calls
    anything that adds to this set.
  Stage S2 role narrowing (remove-only, each removal carries a skip reason):
    capacity (role policy over capacity class + confidence), quota (QuotaView: cooldown/reserve),
    pool (keep the best-ordered route per backend pool), family (reviewer independence, controller
    fence, implementer exclusion), measured demotion (role-scoped non-completion), operator override
    file. Output H2 plus skip list [{route_id, stage, reason}].
  Stage S3 advisory order: role_strength signal through advise_order. Low confidence (stale or
    missing) leaves the legacy order. Output H3 ordered ladder.
  Assertions: H3 set == H2 set, H2 subset of H1, every route in H3 present in AdmittedSet. An empty H3
    gives LadderResult(status=FAIL_CLOSED, reason=...), never a silent default and never a hang.

capacity_precedence: |
  Evaluated per route, highest precedence first. Scope is connection unless stated. A lower row can
  never downgrade the class set by a higher row.
  P1 route-scoped billing evidence: current billing_402_metered health entry (entry.until > now)
     -> METERED, confidence observed. Expiry: 24h after the last 402 (configurable); refreshed by
     every new 402. Never cleared by auth type or pricing.
  P2 connection-scoped billing evidence: >= 1 HTTP 402 on any route of the connection within 24h
     (call logs, T1 fields) -> METERED for every route of the connection, confidence observed.
     Example: Kilo Code oauth with 2 x 402. Same expiry rule as P1.
  P3 explicit positive pricing (any price > 0) -> METERED, confidence declared. Never FREE.
     Example: OpenCode Go (apikey_positive_pricing).
  P4 openrouter-family route outside the public free set -> METERED (existing); inside the free set
     -> FREE, declared. Anthropic api key -> METERED (existing).
  P5 :free suffix (non-openrouter) or connection-level free signal or all-zero explicit pricing
     -> FREE, declared.
  P6 oauth with no paid evidence -> SUBSCRIPTION, confidence assumed (assumed_subscription_oauth).
  P7 no evidence at all -> FREE, confidence assumed (assumed_free_no_paid_evidence, D7 unchanged).
     Example: keyless ovhfree/kilofree nodes.
  P8 connection blocked (auth/verification failure, e.g. Gemini sign-in) -> class unchanged, but
     availability UNAVAILABLE with reason. Never healthy, never a candidate until a fresh success.
  Missing connection row -> UNKNOWN (existing). It fails entitlement.
  Conflicts and the eligibility result per role:
    billing vs oauth: METERED wins. Excluded from every role unless existing metered consent applies.
      Pay-per-token is never used by default.
    billing expired vs pricing positive: METERED (P3).
    pricing zero vs observed 402: METERED (P1/P2 outrank P5).
    oauth assumed SUBSCRIPTION: eligible for all roles once a fresh agentic passport or success
      exists. Without one: implementer low-risk only, ranked after observed/declared subscription.
    assumed FREE (P7): implementer low-risk with fresh passport only. For planner, reviewer,
      controller and escalation it is treated as UNKNOWN, ranked last, and never makes a ladder
      non-empty on its own.
  Freshness: evidence older than its TTL drops one confidence level (observed -> assumed). Billing
  evidence expires only through the explicit 402 expiry. Name or vendor literals are not inputs.

reliability_contract: |
  One observation schema, ReliabilityObservation v1, mapped onto strength_profiles.StrengthObservation:
    route_id (canonical, alias-collapsed), served_model (from the call log or response headers),
    pool, attempt_id (Verdict attempt id or gateway call-log id), source (verdict_attempt |
    gateway_call_log), role (planner|implementer|reviewer|escalation|controller|unknown),
    outcome (success | task_failure | health_failure), failure_class (StrengthFailureClass;
    auth/identity/config/transport/timeout/quota_429/billing_402 are health_failure),
    started_at, finished_at, observed_at, dedup_key = sha256(source_family + attempt_id).
    A gateway log matching a Verdict attempt by request id is merged, never counted twice.
  Denominator: success + task_failure only. task_failure = completed HTTP response that the role
  checker rejects (no tool call, invalid plan, empty or skipped review, tests failed, worker gave
  up). Health failures go to health_cache only and never reduce strength (strength_profiles contract).
  Served-identity validation: if served_model != requested route_id (after alias collapse), the
  observation is credited to the served identity, and the requested route records
  identity_mismatch as a health failure. Unknown served identity -> role=unknown, excluded from the
  denominator.
  Score: reliability = Wilson lower bound (z=1.96) of success/(success+task_failure) per (identity,
  role) over 14 days of attempts and the 24h call-log window. Fewer than n_min=5 observations ->
  reliability unknown (confidence penalty, not zero).
  Demotion: >= 20 role attempts with Wilson upper bound < 0.5 -> skip reason measured_non_completion
  at S2 for that role only.
  Cold start: unknown-reliability admitted routes get bounded exploration. Implementer low-risk nodes
  only, at most 1 exploratory node in 10 and at most 3 per run per route. Never planner, reviewer,
  controller, escalation or high-risk nodes. Never ahead of a known-good route (reliability lower
  bound >= 0.8) on a critical node. Every exploration is labelled exploration=true in the ladder event.

quota_contract: |
  QuotaView protocol frozen in T3: state(pool, now) -> {status: open|pressure|cooldown|exhausted,
  until, reason}. In T3, T4 and T5 it is a no-op that always returns open.
  T6 implementation, verdict/quota_share.py:
    Store: one JSON file under VERDICT_HOME, fcntl LOCK_EX read-modify-write, atomic os.replace,
      the same pattern as orchestration/health_cache.py. Every update is atomic across processes
      (orchestrator, escalation and worker harnesses share it).
    Events: 429, 'credentials cooling down', Retry-After, quota headers from call logs or attempts.
      Dedup by dedup_key, so a repeated event never extends state twice.
    Cooldown expiry: until = max(existing until, now + max(Retry-After, local cooldown)). It only
      moves forward until it expires. Retry-After is honoured when present and larger. Local cooldown
      defaults to 60s, doubling per repeat event within 15 min, capped at 30 min.
    Hysteresis: open -> pressure at >= 2 x 429 in 15 min; pressure -> cooldown on an explicit
      cooldown message or Retry-After; cooldown -> pressure on expiry; pressure -> open only after a
      minimum hold of 10 min with 0 new events. All thresholds come from config (below).
    Config (precedence env > ~/.config/verdict/verdict.yaml key under quota_share: > default; read
      once per ladder build; an out-of-bounds or non-integer value fails closed at load with
      reason quota_config_invalid, never clamped silently):
      env VERDICT_QUOTA_PRESSURE_429_COUNT  / yaml quota_share.pressure_429_count   default 2    bounds 1..100
      env VERDICT_QUOTA_PRESSURE_WINDOW_S   / yaml quota_share.pressure_window_s    default 900  bounds 60..86400
      env VERDICT_QUOTA_MIN_HOLD_S          / yaml quota_share.min_hold_s           default 600  bounds 0..86400
      env VERDICT_QUOTA_COOLDOWN_BASE_S     / yaml quota_share.cooldown_base_s      default 60   bounds 1..3600
      env VERDICT_QUOTA_COOLDOWN_MULTIPLIER / yaml quota_share.cooldown_multiplier  default 2    bounds 1..10
      env VERDICT_QUOTA_COOLDOWN_MAX_S      / yaml quota_share.cooldown_max_s       default 1800 bounds cooldown_base_s..86400
      env VERDICT_QUOTA_RETRY_AFTER_POLICY  / yaml quota_share.retry_after_policy   default max  allowed {max}
        (Retry-After wins when larger; no option lets a local value shorten a provider Retry-After.)
    Reserve, by role priority under pressure/cooldown: implementer and reviewer drop the pool first,
      then escalation, and the controller last. During cooldown the controller and escalation try the
      pool only after its until time. Escalation during cooldown takes the next pool in its ladder
      (one per vendor). It does not wait.
    All pools exhausted for a role -> LadderResult FAIL_CLOSED (reason quota_exhausted_all_pools) and
      the runtime ends BLOCKED, per tests/test_orch_runtime.py::test_pool_exhaustion_fails_closed_explicitly
      and tests/test_orch_recovery.py TestRecoveryBudget. Never a wait loop.

shadow_event_contract: |
  events.jsonl record type role_ladder.shadow, schema_version 1: role, node_id, run_id,
  correlation_id (joins the later dispatch outcome), mode, H0, H1, H2, H3, admitted_set (full sorted
  list), dynamic_candidates (full ordered list with per-route score parts: external_strength,
  strength_source, strength_age_s, reliability_lb, n, confidence, capacity_class,
  capacity_confidence, capacity_evidence, pool, quota_status, exploration), skips
  [{route_id, stage, reason}], legacy_pick, dynamic_pick, agree (bool), signals_digest,
  metadata_fixture (bool).
  Side-effect free: no HTTP calls beyond the reads already made for dispatch, no health_cache or
  quota writes, no change to the dispatched route, attempts or permits. Deterministic for fixed
  inputs (sorted keys, injected clock).

