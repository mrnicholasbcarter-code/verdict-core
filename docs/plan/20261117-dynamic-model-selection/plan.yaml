tasks:
  - id: T1
    title: Research - inventory greps, identity coverage, capacity and call-log evidence
    description: |
      Rung: reuse, read-only. (a) With SCOPE='verdict scripts .prime packages benchmarks config deploy examples contracts'
      (every in-repo dir holding workflow or runtime code; .prime/ is Verdict workflow code), run and
      record the raw output, with line counts, of:
        git grep -nE "['\"](auto|combo)/[A-Za-z0-9._:-]+['\"]" -- $SCOPE
        git grep -nE "DEFAULT_[A-Z_]*MODEL|CONTROLLER_MODEL|VERDICT_CONTROLLER_MODEL" -- $SCOPE
        git grep -nE "model *[:=] *['\"][a-z0-9-]+/[A-Za-z0-9._:-]+['\"]" -- $SCOPE
        git grep -nE "['\"](cc|cx|kr|mistral|anthropic|openai|gemini|kimi|qwen|deepseek|nvidia|kilocode|ovhfree|kilofree)/" -- $SCOPE
        git grep -nE "codestral|devstral|coder|_PATTERNS|family" -- verdict/classifier.py verdict/subagent_selection.py verdict/orchestration/provider_catalog.py .prime/agent/skills/verdict-dispatch/scripts
      and reconcile each hit against hardcoded_inventory with a disposition.
      (b) Identity-join coverage of the live inventory via verdict/metadata/mapping.py: mapped and
      unmapped counts per vendor/alias family, and the join rule used for each.
      (c) Capacity evidence for OpenCode Go, Kilo Code oauth (402s: credits or plan?), Gemini Pro
      g1-pro-tier, and ovhfree/kilofree (why absent from `verdict eligibility`): the raw OmniRoute
      field names and a redacted sample per case, mapped to capacity_precedence rows.
      (d) Call-log fields for ReliabilityObservation (request id, requested vs served model,
      connection, status, error text, timestamps), the maximum page/lookback, and Retry-After/quota
      header availability.
    wave: 1
    depends_on: []
    agent: gem-researcher
    exploration_mode: audit
    status: pending
    retries_used: 0
    acceptance_criteria:
      - "docs/plan/20261117-dynamic-model-selection/research.md contains the five grep commands with raw output, and every hit has a disposition (DR/RS/RT/FX/OO/DO). Hits not in hardcoded_inventory are listed under 'additions'."
      - "research.md reports mapped/unmapped counts per vendor family and the join rule per mapped id."
      - "research.md maps each of the four capacity cases to a capacity_precedence row with raw field names and a redacted sample."
      - "research.md lists call-log fields per ReliabilityObservation field (or 'absent'), the lookback limit, and whether Retry-After is visible."
      - "No secrets, tokens, account ids or /home paths in research.md (vgate host-path guard)."
    handoff:
      constraints:
        - "Read-only: GET only, no chat/completions, no POST/PUT to OmniRoute. Write only research.md."
        - "Free-tier researcher."
      high_risk_signals: [cross_domain_impact]

  - id: T2
    title: ADR-042 and OpenSpec change dynamic-role-selection
    description: |
      Rung: reuse (docs). docs/adr/ADR-042-dynamic-role-model-selection.md, amending ADR-036 planner
      and reviewer selection and citing ADR 0001 invariants unchanged. openspec/changes/
      dynamic-role-selection/{proposal.md,tasks.md,specs/role-selection/spec.md} with requirements
      for: pipeline_contract, capacity_precedence, reliability_contract, quota_contract,
      shadow_event_contract, flag modes per entry point, reviewer independence, the controller role,
      the inventory dispositions, the permanent off fail-safe and the T12 cleanup limits, and post-merge checks L1-L5 as `- [ ] (post-merge)`
      tasks. Update the EVIDENCE_INDEX link only when evidence exists (not here).
    wave: 2
    depends_on: [T1]
    agent: gem-documentation-writer
    status: pending
    retries_used: 0
    acceptance_criteria:
      - "`openspec validate dynamic-role-selection --strict` passes."
      - "uv run python scripts/check_doc_links.py passes."
      - "ADR and spec each state: strength never admits; narrowing only removes; H3 subset H2 subset H1; unknown never healthy; opaque never candidates; fixture metadata never live proof; pay-per-token never default."
      - "tasks.md has L1-L5 with the exact `- [ ] (post-merge)` marker and passes scripts/check_openspec_tasks.py."
    handoff:
      constraints:
        - "Owned files: docs/adr/ADR-042-dynamic-role-model-selection.md, openspec/changes/dynamic-role-selection/**."
        - "No line-number citations; no savings or benchmark numbers."

  - id: T3
    title: Slice 1 - read-only fail-closed ladder library and `verdict ladder --role planner --json`
    description: |
      Rung: reuse admission, capacity.classify, provider_catalog pools, metadata store, and
      decision_signals advise_order; new code is only the stage composer. New
      verdict/role_selection.py: Role enum (all five declared; only planner enabled, the others raise
      RoleNotEnabled), LadderResult (status ok|FAIL_CLOSED, reason, ordered routes, skips, H0-H3),
      the frozen QuotaView protocol with a no-op OpenQuotaView, and build_ladder(role, admitted,
      inventory, signals, quota_view, clock). S2 in this slice is pool dedup plus the existing
      capacity classes only (pay-per-token removed, the existing D6 tier order). S3 uses external
      strength from the metadata store. New verdict/role_ladder_event.py builds the deterministic
      role_ladder.shadow record (schema v1) without writing it anywhere except stdout for the CLI.
      CLI: `verdict ladder --role planner --json [--inventory-fixture PATH]` in a new
      verdict/commands/parsers_ladder.py and a dispatch entry. It is read-only and prints
      LadderResult plus the event. It exits non-zero on FAIL_CLOSED. Fixture input sets
      metadata_fixture=true and live_proof=false. No defaults removed, no dispatch, no reviewer or
      controller wiring, no quota, no operator files.
    wave: 2
    depends_on: [T1]
    agent: gem-implementer
