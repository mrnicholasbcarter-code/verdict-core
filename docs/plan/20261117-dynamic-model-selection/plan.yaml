open_questions:
  - q: "Change capacity.classify() so absence of evidence yields UNKNOWN instead of FREE (D7)?"
    recommended: "No. Keep D7 output and add capacity_confidence. The ladder treats assumed FREE as UNKNOWN for critical roles and as free only for low-risk implementer work with a fresh passport. This needs your confirmation because it narrows D7 for critical roles."
  - q: "Role weights for external strength?"
    recommended: "Planner, escalation, reviewer and controller: AA intelligence index. Implementer: mean of the AA and fcm coding indices. Multiplied by the reliability lower bound."
  - q: "Demotion and cold-start bounds?"
    recommended: "Demote at >= 20 role attempts with Wilson upper bound < 0.5. Explore at most 1 in 10 low-risk implementer nodes and 3 per route per run."
  - q: "Quota thresholds on the Claude subscription?"
    recommended: "Pressure at >= 2 x 429 in 15 min; 10-minute minimum hold; local cooldown 60 s doubling to a 30 min cap; Retry-After wins when larger."
  - q: "Kilo Code with HTTP 402s?"
    recommended: "Pay-per-token (METERED) for the whole connection until 24h after the last 402. Confirm with T1's plan fields."
  - q: "Low-risk reviewer fallback to the same family on a distinct pool?"
    recommended: "Allow it with receipt reason reviewer_same_family_fallback. Forbid it for protected or high-risk work."
  - q: "Keep the Mistral/Codestral exclusion?"
    recommended: "Move it to the operator override file now. Remove it once measured demotion covers those models for the implementer role."
  - q: "When may T12 remove legacy constants?"
    recommended: "After 14 consecutive days of passing L1-L5 on main with no rollback, and only constants no mode reads. Flag value off is permanent (emergency fail-safe)."
