  legacy value kept for the permanent off fail-safe), RS = retained sentinel, RT = retained
  capability taxonomy (advisory/eligibility input, re-scoped), FX = fixture-only (labelled, never
  live proof), OO = operator override (host file, operator-owned), DO = display-only example.
