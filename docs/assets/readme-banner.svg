<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-labelledby="t d">
  <title id="t">Verdict</title>
  <desc id="d">Static artwork with no run data: the project name and the names of the stages of a run, from goal to receipt.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0c11"/>
      <stop offset="1" stop-color="#15151c"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22b8eb"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#22b8eb" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#22b8eb" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="18" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1279" height="319" rx="17.5" fill="none" stroke="#2a2a33"/>

  <!-- mark and name -->
  <g transform="translate(72 64)">
    <rect width="88" height="88" rx="18" fill="#18181b" stroke="url(#mark)" stroke-width="2.5"/>
    <path d="M23 46 L38 61 L66 29" fill="none" stroke="url(#mark)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="188" y="134" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="84" font-weight="700" fill="#f4f4f5" letter-spacing="-2">Verdict</text>

  <!-- the stages of a run, left to right -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="17" text-anchor="middle">
    <g fill="#18181b" stroke-width="1.6">
      <rect x="72"   y="214" width="132" height="46" rx="10" stroke="#52525b"/>
      <rect x="240"  y="214" width="132" height="46" rx="10" stroke="#22b8eb"/>
      <rect x="408"  y="214" width="132" height="46" rx="10" stroke="#a78bfa"/>
      <rect x="576"  y="214" width="132" height="46" rx="10" stroke="#22b8eb"/>
      <rect x="744"  y="214" width="132" height="46" rx="10" stroke="#f5b00b"/>
      <rect x="912"  y="214" width="132" height="46" rx="10" stroke="#a78bfa"/>
      <rect x="1080" y="214" width="132" height="46" rx="10" stroke="#4ade80"/>
    </g>
    <g fill="#f4f4f5">
      <text x="138"  y="243">goal</text>
      <text x="306"  y="243">plan</text>
      <text x="474"  y="243">admit</text>
      <text x="642"  y="243">run</text>
      <text x="810"  y="243">recover</text>
      <text x="978"  y="243">review</text>
      <text x="1146" y="243">receipt</text>
    </g>
    <g stroke="#7c7c88" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M210 237 H232 M226 231 L232 237 L226 243"/>
      <path d="M378 237 H400 M394 231 L400 237 L394 243"/>
      <path d="M546 237 H568 M562 231 L568 237 L562 243"/>
      <path d="M714 237 H736 M730 231 L736 237 L730 243"/>
      <path d="M882 237 H904 M898 231 L904 237 L898 243"/>
      <path d="M1050 237 H1072 M1066 231 L1072 237 L1066 243"/>
    </g>
  </g>
</svg>
