<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-labelledby="t d">
  <title id="t">Verdict</title>
  <desc id="d">Static artwork, no run data. A goal and a git repository go in; the run is planned, models are admitted on live evidence, work runs and recovers within a limit, a separate route reviews it, and a receipt comes out.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0c11"/>
      <stop offset="1" stop-color="#15151c"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22b8eb"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#22b8eb" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#22b8eb" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="360" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="18" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1279" height="359" rx="17.5" fill="none" stroke="#2a2a33"/>

  <!-- mark: a check inside a receipt edge -->
  <g transform="translate(72 70)">
    <rect width="76" height="76" rx="16" fill="#18181b" stroke="url(#mark)" stroke-width="2.5"/>
    <path d="M20 40 L33 53 L57 25" fill="none" stroke="url(#mark)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="172" y="128" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="68" font-weight="700" fill="#f4f4f5" letter-spacing="-1.5">Verdict</text>
  <text x="74" y="196" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" fill="#d4d4d8">A control plane for coding agents that shows its work.</text>

  <!-- the run, left to right -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="17" text-anchor="middle">
    <g fill="#18181b" stroke-width="1.6">
      <rect x="72"   y="252" width="132" height="46" rx="10" stroke="#52525b"/>
      <rect x="240"  y="252" width="132" height="46" rx="10" stroke="#22b8eb"/>
      <rect x="408"  y="252" width="132" height="46" rx="10" stroke="#a78bfa"/>
      <rect x="576"  y="252" width="132" height="46" rx="10" stroke="#22b8eb"/>
      <rect x="744"  y="252" width="132" height="46" rx="10" stroke="#f5b00b"/>
      <rect x="912"  y="252" width="132" height="46" rx="10" stroke="#a78bfa"/>
      <rect x="1080" y="252" width="132" height="46" rx="10" stroke="#4ade80"/>
    </g>
    <g fill="#f4f4f5">
      <text x="138"  y="281">goal</text>
      <text x="306"  y="281">plan</text>
      <text x="474"  y="281">admit</text>
      <text x="642"  y="281">run</text>
      <text x="810"  y="281">recover</text>
      <text x="978"  y="281">review</text>
      <text x="1146" y="281">receipt</text>
    </g>
    <g stroke="#7c7c88" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M210 275 H232 M226 269 L232 275 L226 281"/>
      <path d="M378 275 H400 M394 269 L400 275 L394 281"/>
      <path d="M546 275 H568 M562 269 L568 275 L562 281"/>
      <path d="M714 275 H736 M730 269 L736 275 L730 281"/>
      <path d="M882 275 H904 M898 269 L904 275 L898 281"/>
      <path d="M1050 275 H1072 M1066 269 L1072 275 L1066 281"/>
    </g>
  </g>
  <text x="1208" y="330" text-anchor="end" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8b8b96">admission · bounded recovery · separate review · verifiable receipts</text>
</svg>
