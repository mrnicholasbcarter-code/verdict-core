[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["verdict"]
artifacts = ["schemas/contracts.v1.json", "schemas/evaluation.v1.json", "schemas/context-pack.v1.json", "schemas/runtime-health.v1.json", "schemas/runtime-passport.v1.json", "schemas/gateway-adapter.v1.json", "schemas/proof-receipt.v1.json", "verdict/schemas/claims-ledger.v1.json"]

[tool.hatch.build.targets.wheel.force-include]
"verdict/data/omniroute_models_dev_map.json" = "verdict/data/omniroute_models_dev_map.json"
"verdict/schemas/model-metadata.v1.json" = "verdict/schemas/model-metadata.v1.json"
# Default benchmark fixtures ship in the wheel so the documented
# `verdict benchmark [--savings]` commands work without a source checkout.
"benchmarks/fixtures" = "verdict/data/benchmarks/fixtures"

[project]
name = "verdict-core"
version = "0.2.0"
description = "Fail-closed LLM routing control plane: cheapest qualified model, named drop reasons, receipts."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Nicholas Carter"}]
keywords = ["llm", "routing", "ai", "control-plane", "safety", "openai", "anthropic", "multi-model"]
dependencies = [
    "httpx>=0.28.1",
    "PyYAML>=6.0.3",
    "rich>=15.0.0",
    "defusedxml>=0.7.1",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

[project.optional-dependencies]
server = ["fastapi>=0.141.1", "uvicorn>=0.53.0"]
dashboard = ["streamlit>=1.64.0", "plotly>=7.1.0", "pandas>=2.3.3"]
# `all` is what `verdict serve` / `verdict dashboard` tell users to install;
# it must cover both the server and the dashboard suites.
all = [
    "fastapi>=0.141.1",
    "uvicorn>=0.53.0",
    "streamlit>=1.64.0",
    "plotly>=7.1.0",
    "pandas>=2.3.3",
]
dev = [
    "pyopenssl>=26.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
    "mypy>=2.3.1",
    "vcrpy>=8.3.0",
    "types-PyYAML",
    "jsonschema>=4.26.0",
    "types-jsonschema>=4.26.0.20260518",
    "types-defusedxml>=0.7.0.20260504",
    "code-review-graph>=2.3.8",
    "cyclonedx-bom>=7.4.0",
    # tests parse pyproject.toml; tomllib is stdlib only from 3.11
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
verdict = "verdict.cli:main"

[project.urls]
Homepage = "https://github.com/mrnicholasbcarter-code/verdict-core"
Repository = "https://github.com/mrnicholasbcarter-code/verdict-core"
Issues = "https://github.com/mrnicholasbcarter-code/verdict-core/issues"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "B008"]
per-file-ignores = { "tests/*" = ["S101"] }

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true
exclude = [
    "docs/**/*.md",
    "exports/*.md",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict = true
# Exclusions are explicit path regexes with owner and removal rationale.
# verdict.dashboard: Streamlit UI with incomplete third-party stubs; non-critical
# presentation layer tested via install smoke. Owner: @mrnicholasbcarter
# Removal: defer until Streamlit 2.x ships strict-compatible stubs or dashboard
# is rewritten against a type-complete UI library.
exclude = [
    "^verdict/dashboard\\.py$",  # Streamlit stubs incomplete
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["verdict"]
omit = ["tests/*", "*/__pycache__/*"]

[tool.hatch.envs.default]
dependencies = ["verdict-core"]

[tool.uv]
constraint-dependencies = [
    "gitpython>=3.1.60",
]
