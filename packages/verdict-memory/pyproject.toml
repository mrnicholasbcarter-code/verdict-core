[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "verdict-memory"
version = "0.1.0a1"
description = "Reusable lifecycle/memory capability package: versioned capture/recall contracts, bounded outbox, authenticated ai-memory client."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Nicholas Carter"}]
keywords = ["memory", "lifecycle", "ai-memory", "outbox", "verdict"]
dependencies = [
    "httpx>=0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
only-include = ["verdict_memory"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
