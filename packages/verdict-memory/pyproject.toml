[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "verdict-memory"
version = "0.1.0a1"
description = "Reusable lifecycle/memory capability package: versioned capture/recall contracts, bounded outbox, authenticated ai-memory client."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Nicholas Carter"}]
keywords = ["memory", "lifecycle", "ai-memory", "outbox", "verdict"]
dependencies = [
    "httpx>=0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "build>=1.2",
]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/vectors",
    "/docs",
    "/README.md",
    "/pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/verdict_memory"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
