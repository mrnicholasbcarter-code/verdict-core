name: Feature Request
description: Suggest a new feature or enhancement
title: "[FEATURE] "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please provide details below.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe your ideal solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Other approaches you've considered
  - type: dropdown
    id: component
    attributes:
      label: Target Component
      options:
        - Core routing (gate, availability, eligibility)
        - API server (FastAPI)
        - CLI
        - Contracts
        - Intelligence/RuVector
        - Swarm/Dispatcher
        - Documentation
        - CI/CD
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: This aligns with Verdict's policy-gated architecture
          required: true
        - label: This maintains deterministic safety floors
          required: true
        - label: I am willing to implement or help test
          required: false
