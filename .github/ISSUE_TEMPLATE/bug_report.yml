name: Bug Report
description: Report a bug in verdict-core
title: "[BUG] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the sections below.
  - type: input
    id: version
    attributes:
      label: Verdict Version
      description: What version of verdict-core are you using?
      placeholder: "0.1.0"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Clear and concise description of the bug
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Minimal steps to reproduce the issue
      placeholder: |
        1. Run `verdict route ...`
        2. Observe error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen instead?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happens?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs/Stack Traces
      description: Paste any relevant logs or stack traces
      render: text
  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      options:
        - Core routing (gate, availability, eligibility)
        - API server (FastAPI)
        - CLI
        - Contracts
        - Intelligence/RuVector
        - Swarm/Dispatcher
        - Tests/CI
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues
          required: true
        - label: I am using the latest version
          required: true
        - label: This is not a duplicate
          required: true
