name: Lint
on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,server,dashboard]"
      - name: Run Ruff linter
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Run mypy
        run: mypy verdict --strict
      - name: Check documentation links
        run: python scripts/check_doc_links.py
      - name: Ensure no verdict.dev references
        run: |
          if git grep -n 'verdict.dev'; then
            echo "Error: Found 'verdict.dev' references (BOD-254). Use github.com/mrnicholasbcarter-code/verdict-core instead."
            exit 1
          fi
