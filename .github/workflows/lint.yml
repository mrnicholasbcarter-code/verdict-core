name: Lint
on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,server,dashboard]"
      - name: Run Ruff linter
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Run mypy
        run: mypy verdict --strict
      - name: Check documentation links
        run: python scripts/check_doc_links.py
      - name: Ensure no retired-domain references (BOD-254)
        run: |
          # Pattern is split so this workflow file does not match itself.
          if git grep -n -E "verdict""\.""dev"; then
            echo "Error: retired domain reference found (BOD-254). Use github.com/mrnicholasbcarter-code/verdict-core instead."
            exit 1
          fi
      - name: Run vulture (dead code)
        run: |
          python -m pip install "vulture==2.16"
          vulture verdict/ .vulture-whitelist.py --min-confidence 80
      - name: 'Reachability report (BOD-316: "done means wired")'
        run: python scripts/check_reachability.py

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error
