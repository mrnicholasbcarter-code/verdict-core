name: Lint
on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
jobs:
  # Not named "lint": that required check is the lint job in ci.yml, which also
  # runs the reachability, definition-of-done, proof-path and OpenSpec gates.
  docs-and-dead-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,server,dashboard]"
      - name: Check documentation links
        run: python scripts/check_doc_links.py
      - name: Ensure no retired-domain references (BOD-254)
        run: |
          # Pattern is split so this workflow file does not match itself.
          if git grep -n -E "verdict""\.""dev"; then
            echo "Error: retired domain reference found (BOD-254). Use github.com/mrnicholasbcarter-code/verdict-core instead."
            exit 1
          fi
      - name: Run vulture (dead code)
        run: |
          python -m pip install "vulture==2.16"
          vulture verdict/ .vulture-whitelist.py --min-confidence 80

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error
