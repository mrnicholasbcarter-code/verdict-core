name: Publish verdict-client to npm

on:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: npm ci --workspaces
      - name: Build verdict-client
        run: cd verdict/client-sdk && npm run build
      - name: Run verdict-client tests
        run: cd verdict/client-sdk && npm test
      - name: Verify package contents
        run: cd verdict/client-sdk && npm pack --dry-run
      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: client-sdk-package
          path: verdict/client-sdk/dist/
