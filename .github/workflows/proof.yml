name: Proof

# BOD-89 canonical proof pipeline — same entrypoint as local/agent.
# Does not replace matrixed install-smoke / multi-Python jobs in ci.yml;
# those remain complementary. This workflow is the shared DAG contract.

on:
  pull_request:
    branches: [main, master, develop]
  push:
    branches: [main, master, develop]
  workflow_dispatch:

# Cancel stale in-flight proof runs on the same PR branch on a new push.
# Never cancel main/tag runs (use the unique run_id as the group key instead).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  proof-targeted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The proof gates run the full suite, whose check_dod validation needs
          # the merged_sha commit of every docs/proof/dod/*.json to be present.
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Install dependencies
        run: uv sync --extra dev --extra server --extra dashboard
      - name: Canonical targeted proof
        run: |
          uv run python scripts/proof/run.py \
            --mode targeted \
            --targets tests/test_proof_pipeline.py \
            --report proof-report-targeted.json \
            --json
      - name: Upload targeted proof report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: proof-report-targeted
          path: proof-report-targeted.json
          if-no-files-found: warn
          retention-days: 30

  # The full proof runs as one leg per number in modes.full.shards (proof/contract.yaml);
  # tests/test_proof_workflow.py keeps the matrix equal to 1..shards. No leg waits for
  # proof-targeted, which stays as an early signal. A leg is today's single job with
  # --shard added, so it runs every gate in the same environment.
  proof-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
        with:
          # Same history depth as proof-targeted: the unit_full gate validates
          # docs/proof/dod/*.json merged_sha commits (scripts/check_dod.py).
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Install dependencies
        run: uv sync --extra dev --extra server --extra dashboard
      - name: Install Semgrep CE (isolated tool, not in the project venv)
        # semgrep pins its own dependency versions (e.g. pyjwt~=2.13.0). Installing
        # it into the project venv replaced locked packages, so the proof ran and
        # pip-audit scanned a dependency set that differs from uv.lock.
        run: |
          uv tool install semgrep
          uv tool dir --bin >> "$GITHUB_PATH"
      - name: Install build tooling
        run: uv pip install build
      - name: Canonical full proof leg (no-cache final mode)
        env:
          # The runner launches the unit_timing gate without this variable, so the
          # serial timing tests never see the xdist options (proof/contract.yaml env_clear).
          PYTEST_ADDOPTS: "-p xdist -n auto"
        run: |
          uv run python scripts/proof/run.py \
            --mode full \
            --no-cache \
            --otel \
            --targets tests/test_proof_pipeline.py \
            --shard ${{ matrix.shard }} \
            --report proof-shard-${{ matrix.shard }}/proof-report-full.json \
            --json
      - name: Upload leg report, test ids and JUnit files
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: proof-shard-${{ matrix.shard }}
          path: proof-shard-${{ matrix.shard }}/
          # A re-run leg uploads again; without this the upload fails on the old name.
          overwrite: true
          if-no-files-found: warn
          retention-days: 30

  # The aggregate. It keeps the check name `proof-full` that reports on every pull
  # request head today, so making it required later (operator step, proof/README.md)
  # leaves no window in which a required check never reports. `if: always()` because
  # a skipped required check counts as passing: it must run, and fail, when a leg
  # failed or was cancelled. It does not trust `needs` alone: scripts/proof/aggregate.py
  # checks every leg itself.
  proof-full:
    runs-on: ubuntu-latest
    needs: [proof-shard]
    if: always()
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Install dependencies
        run: uv sync --extra dev --extra server --extra dashboard
      - name: Download leg files
        # None, one or all legs may have uploaded; the aggregate names what is missing.
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          pattern: proof-shard-*
          # A directory of its own, so that the aggregate never scans the checkout and
          # never meets its own output (proof-report-full.json) among the legs.
          path: proof-legs
      - name: Aggregate the legs (fails closed)
        run: |
          uv run python scripts/proof/aggregate.py \
            --reports proof-legs \
            --leg-result "${{ needs.proof-shard.result }}" \
            --expected-sha "$GITHUB_SHA" \
            --report proof-report-full.json \
            --json
      - name: Upload full proof report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: proof-report-full
          path: proof-report-full.json
          if-no-files-found: warn
          retention-days: 30

  proof-matrix-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Install dependencies
        run: uv sync --extra dev --extra server --extra dashboard
      - name: Verify proof matrix doc is up to date
        run: uv run python scripts/generate_proof_matrix.py --check
      - name: Run proof matrix tests
        run: uv run pytest tests/test_proof_matrix_doc.py -v
