name: Validate Python Package Candidate

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to validate
        required: true
        type: string

jobs:
  build:
    name: Build distribution 📦
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ inputs.tag }}
    
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.10"
        
    - name: Install Hatch
      run: python3 -m pip install hatch --user
      
    - name: Build a binary wheel and a source tarball
      run: hatch build
      
    - name: Store the distribution packages
      uses: actions/upload-artifact@v7
      with:
        name: python-package-distributions
        path: dist/

    - name: Check distribution metadata
      run: python3 -m pip install twine --user && python3 -m twine check dist/*
