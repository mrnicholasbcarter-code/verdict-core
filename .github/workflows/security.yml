name: Security Scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --extra dev --extra dashboard --extra server

      - name: Install pip-audit and bandit
        run: uv pip install pip-audit bandit

      - name: Run memory boundary tests
        run: uv run pytest tests/security/ -q --junitxml=memory-boundary-results.xml

      - name: Upload memory boundary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memory-boundary-results
          path: memory-boundary-results.xml
          if-no-files-found: warn
          retention-days: 30

      - name: Run privacy retention and telemetry tests
        run: uv run pytest tests/privacy/ -q --junitxml=privacy-results.xml

      - name: Upload privacy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: privacy-results
          path: privacy-results.xml
          if-no-files-found: warn
          retention-days: 30

      - name: Run pip-audit
        run: uv run pip-audit --local -f json -o pip-audit-results.json

      - name: Upload pip-audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-results
          path: pip-audit-results.json
          retention-days: 30

      - name: Run bandit
        run: uv run bandit -r verdict -ll -s B108 -f json -o bandit-results.json

      - name: Upload bandit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-results
          path: bandit-results.json
          retention-days: 30

      - name: Verify repository has no committed credential files
        run: |
          git ls-files -z | python3 -c '
          import re
          import sys

          allowed = {".env.memory.example"}
          pattern = re.compile(
              r"(^|/)(\.envrc([._-].*)?|\.env([._-].*)?|[^/]*\.env|.*\.(pem|key|crt|cer|der|p12|pfx)(\.[^/]*)?|id_(rsa|dsa|ecdsa|ed25519)(\.[^/]*)?)$",
              re.IGNORECASE,
          )
          paths = (path.decode("utf-8", "surrogateescape") for path in sys.stdin.buffer.read().split(b"\0"))
          blocked = [path for path in paths if path and path not in allowed and pattern.search(path)]
          if blocked:
              print("Committed credential-shaped files:\n" + "\n".join(blocked), file=sys.stderr)
              raise SystemExit(1)
          '

  node-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci --ignore-scripts

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high --json > npm-audit-results.json

      - name: Upload npm audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-results
          path: npm-audit-results.json
          retention-days: 30

  sbom-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --extra dev --extra dashboard --extra server

      - name: Generate Python SBOM
        run: uv run cyclonedx-py environment --output-reproducible -o sbom-python.cdx.json

      - name: Upload Python SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-python
          path: sbom-python.cdx.json
          retention-days: 30

  sbom-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci --ignore-scripts

      - name: Generate Node SBOM
        run: npx --no-install @cyclonedx/cyclonedx-npm --output-reproducible --spec-version 1.6 --omit dev --output-file sbom-node.cdx.json

      - name: Upload Node SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-node
          path: sbom-node.cdx.json
          retention-days: 30

  dynamic-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --extra dev --extra dashboard --extra server

      - name: Start verdict API server
        env:
          # Ephemeral, isolated CI target with no real data or upstream
          # credentials configured; anonymous access lets the scanner reach
          # routes beyond /health for a meaningful dynamic scan (FR-003).
          LLMGATE_ALLOW_ANONYMOUS: "true"
        run: |
          uv run uvicorn verdict.api:app --host 127.0.0.1 --port 8000 &
          echo $! > uvicorn.pid

      - name: Wait for server health check
        id: health-check
        run: |
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8000/health >/dev/null 2>&1; then
              echo "target_failed_to_start=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 1
          done
          echo "target_failed_to_start=true" >> "$GITHUB_OUTPUT"
          echo "verdict API server did not become healthy within 30s" >&2
          exit 1

      - name: Run ZAP baseline scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "http://127.0.0.1:8000"
          fail_action: true
          allow_issue_writing: false
          rules_file_name: ".zap/rules.tsv"

      - name: Upload dynamic-check evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-check-results
          path: report_json.json
          if-no-files-found: warn
          retention-days: 30

      - name: Stop verdict API server
        if: always()
        run: kill "$(cat uvicorn.pid)" 2>/dev/null || exit 0

  osv-security:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.5.1
    with:
      scan-args: |-
        --config=./osv-scanner.toml
        --lockfile=./uv.lock
        --lockfile=./package-lock.json
    permissions:
      actions: read
      contents: read
      security-events: write
