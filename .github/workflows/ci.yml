name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  typescript-contract-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install Node dependencies (all workspaces)
        run: npm ci --workspaces
      - name: Build TypeScript contracts
        run: cd contracts && npm run build
      - name: Run TypeScript contract fixtures
        run: cd contracts && npm test
      - name: Run consumer smoke test
        run: cd contracts && npm run consumer:smoke
      - name: Build TypeScript client SDK
        run: cd verdict/client-sdk && npm run build
      - name: Run TypeScript client SDK tests
        run: cd verdict/client-sdk && npm test

  client-package-smoke:
    # Replaces the former example-smoke-test, which invoked a TypeScript example
    # that no longer exists and piped it through head, so it passed regardless
    # of the producer's exit status. This job runs a real producer (the client
    # SDK package verifier) under pipefail and fails on any nonzero exit.
    runs-on: ubuntu-latest
    needs: typescript-contract-parity
    defaults:
      run:
        shell: bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install Node dependencies (all workspaces)
        run: npm ci --workspaces
      - name: Build TypeScript contracts
        run: cd contracts && npm run build
      - name: Verify client SDK package contents
        run: cd verdict/client-sdk && npm run verify:package

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every version in requires-python / classifiers is exercised.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,server,dashboard]"
      - name: Run tests
        if: matrix.python-version != '3.13'
        run: pytest tests/ -n auto --dist loadfile -q --tb=short -m "not timing"
      - name: Run tests with coverage
        if: matrix.python-version == '3.13'
        run: pytest tests/ -n auto --dist loadfile -q --tb=short -m "not timing" --cov=verdict --cov-report=xml --cov-fail-under=70
      - name: Run wall-clock timing tests serially
        run: pytest tests/ -q --tb=short -m timing -p no:xdist
      - name: Validate versioned contract schema
        run: python scripts/validate_contract_schema.py
      - name: Validate public proof matrix and claims ledger
        run: python scripts/verify_proof_matrix.py

  lint:
    # Required check. The pipeline fixes formatting and safe lint fixes itself:
    # on a pull request from this repository it commits `ruff check --fix-only`
    # and `ruff format` to the branch. GitHub creates the pull_request runs for
    # that bot commit in the "action_required" state; this job approves them, so
    # the required checks run on the new head with no agent turn (runs started
    # by workflow_dispatch do not count as pull request checks). If it cannot
    # approve them, the job fails. It then fails only on what is left. Fork
    # pull requests get the strict check without the fix.
    # The definition-of-done, OpenSpec, proof-path and reachability gates run
    # here so that they are part of a required check.
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      AUTOFIX: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
      OPENSPEC_TELEMETRY: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.AUTOFIX == 'true' && github.head_ref || '' }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,server,dashboard]"
      - name: Autofix formatting and safe lint fixes (same-repository pull requests)
        if: env.AUTOFIX == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref }}
        run: |
          ruff check --fix-only --exit-zero .
          ruff format .
          if git diff --quiet; then exit 0; fi
          git config user.name "verdict-autofix"
          git config user.email "verdict-autofix@users.noreply.github.com"
          git commit -qam "style: ruff autofix (pipeline)"
          git push origin "HEAD:$BRANCH"
          head=$(git rev-parse HEAD)
          # GitHub creates the pull_request runs of the fix commit a few seconds
          # apart, queued as "action_required". Approve them until no new run
          # has appeared for two polls in a row.
          approved=0
          quiet=0
          last=-1
          for _ in $(seq 1 30); do
            sleep 10
            for run in $(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$head&status=action_required" --jq '.workflow_runs[].id'); do
              gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$run/approve" >/dev/null
              approved=$((approved + 1))
            done
            seen=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$head&event=pull_request" --jq '.total_count')
            if [ "$seen" -eq "$last" ] && [ "$seen" -gt 0 ]; then quiet=$((quiet + 1)); else quiet=0; fi
            last=$seen
            if [ "$quiet" -ge 2 ]; then break; fi
          done
          if [ "$approved" -eq 0 ]; then
            echo "::error::Pushed ruff fixes as ${head:0:8}, but found no pull_request run to approve; re-run the checks on the new head."
            exit 1
          fi
          echo "::notice::Pushed ruff fixes as ${head:0:8} and approved $approved of its $seen pull_request run(s)."
      - name: Run Ruff
        run: ruff check .
      - name: Run Ruff Format (check)
        run: ruff format --check .
      - name: Run MyPy
        run: mypy verdict --strict
      - name: Find the ratchet base
        id: base
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$PR_BASE" ]; then
            echo "sha=$PR_BASE" >> "$GITHUB_OUTPUT"
          elif [ -n "$PUSH_BEFORE" ] && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            echo "sha=$PUSH_BEFORE" >> "$GITHUB_OUTPUT"
          fi
      - name: Reachability (symbols, orphan modules, forbidden symbols; baselines only shrink)
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            python scripts/check_reachability.py --ratchet-base "$BASE_SHA"
          else
            python scripts/check_reachability.py
          fi
      - name: Definition of done (docs/proof/dod evidence; AGENTS.md)
        run: python scripts/check_dod.py --all
      - name: Proof paths change only with a Proof trailer and a valid receipt
        if: steps.base.outputs.sha != ''
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: python scripts/check_proof_paths.py --base "$BASE_SHA"
      - name: openspec validate --all --strict (pinned 1.13.2)
        run: npx --yes @fission-ai/openspec@1.13.2 validate --all --strict --no-interactive
      - name: Touched OpenSpec changes have no open tasks (label wip skips)
        if: steps.base.outputs.sha != ''
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          WIP: ${{ contains(github.event.pull_request.labels.*.name, 'wip') }}
        run: |
          if [ "$WIP" = true ]; then
            python scripts/check_openspec_tasks.py --base "$BASE_SHA" --wip
          else
            python scripts/check_openspec_tasks.py --base "$BASE_SHA"
          fi

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        run: uv sync --frozen --extra dev --extra server
      - name: Run Bandit Security Check
        run: uv run bandit -c pyproject.toml -r verdict -ll
      - name: Run dependency audit
        run: uv run pip-audit --local --skip-editable

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,server,dashboard]"
      - name: Run MyPy
        run: mypy verdict --strict

  install-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Minimal install smoke
        run: |
          python -m venv /tmp/verdict-minimal
          /tmp/verdict-minimal/bin/python -m pip install --upgrade pip
          /tmp/verdict-minimal/bin/python -m pip install .
          /tmp/verdict-minimal/bin/verdict --help
          if output=$(/tmp/verdict-minimal/bin/verdict route "format this README" --criticality low --terse --allow-offline 2>&1); then
            echo "expected offline route to fail closed without provider execution"
            exit 1
          fi
          printf '%s\n' "$output" | grep '"transport_outcome": "error"'
      - name: Server extra smoke
        run: |
          python -m venv /tmp/verdict-server
          /tmp/verdict-server/bin/python -m pip install --upgrade pip
          /tmp/verdict-server/bin/python -m pip install ".[server]"
          /tmp/verdict-server/bin/python -c 'from verdict.api import app; assert app is not None'
      - name: Dashboard extra smoke
        run: |
          python -m venv /tmp/verdict-dashboard
          /tmp/verdict-dashboard/bin/python -m pip install --upgrade pip
          /tmp/verdict-dashboard/bin/python -m pip install ".[dashboard]"
          /tmp/verdict-dashboard/bin/python -c 'import importlib.util as u; assert u.find_spec("verdict.dashboard"); import streamlit, plotly, pandas'
      - name: All extras smoke (what `verdict serve` / `verdict dashboard` recommend)
        run: |
          python -m venv /tmp/verdict-all
          /tmp/verdict-all/bin/python -m pip install --upgrade pip
          /tmp/verdict-all/bin/python -m pip install ".[all]"
          /tmp/verdict-all/bin/verdict detect --json
          /tmp/verdict-all/bin/python -c 'from verdict.api import app; assert app is not None; import streamlit, plotly, pandas'
      - name: Complete install smoke
        run: |
          python -m venv /tmp/verdict-complete
          /tmp/verdict-complete/bin/python -m pip install --upgrade pip
          /tmp/verdict-complete/bin/python -m pip install ".[dashboard,dev,server]"
          /tmp/verdict-complete/bin/verdict detect --json
          /tmp/verdict-complete/bin/python - <<'PY'
          from verdict.api import app

          assert app is not None
          PY

  build:
    runs-on: ubuntu-latest
    needs: [test, lint, security, type-check, install-smoke, typescript-contract-parity, client-package-smoke]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine
      - name: Build package
        run: python -m build
      - name: Check package
        run: python -m twine check dist/*
      - name: Wheel install smoke
        run: |
          python -m venv /tmp/verdict-wheel
          /tmp/verdict-wheel/bin/python -m pip install --upgrade pip
          /tmp/verdict-wheel/bin/python -m pip install dist/*.whl
          /tmp/verdict-wheel/bin/verdict --help
          /tmp/verdict-wheel/bin/verdict detect --json
          /tmp/verdict-wheel/bin/verdict quickstart --json --non-interactive --dry-run > /tmp/verdict-wheel-quickstart.json
          /tmp/verdict-wheel/bin/python -c 'import json; from pathlib import Path; report = json.loads(Path("/tmp/verdict-wheel-quickstart.json").read_text()); assert report["decision"]["selected_route"]["runtime_id"] == "demo/frontier-tools"'
      - name: Wheel benchmark smoke (documented commands, no source checkout)
        run: |
          cd /tmp
          /tmp/verdict-wheel/bin/verdict benchmark --output-json /tmp/verdict-wheel-bench.json
          /tmp/verdict-wheel/bin/verdict benchmark --savings --output-json /tmp/verdict-wheel-savings.json
          /tmp/verdict-wheel/bin/python -c 'import json; from pathlib import Path; report = json.loads(Path("/tmp/verdict-wheel-savings.json").read_text()); assert report["aggregate"]["savings_claimed_count"] == 0, report'
      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
