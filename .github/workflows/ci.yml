name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  typescript-contract-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install Node dependencies (all workspaces)
        run: npm ci --workspaces
      - name: Build TypeScript contracts
        run: cd contracts && npm run build
      - name: Run TypeScript contract fixtures
        run: cd contracts && npm test
      - name: Run consumer smoke test
        run: cd contracts && npm run consumer:smoke
      - name: Build TypeScript client SDK
        run: cd verdict/client-sdk && npm run build
      - name: Run TypeScript client SDK tests
        run: cd verdict/client-sdk && npm test

  client-package-smoke:
    # Replaces the former example-smoke-test, which invoked a TypeScript example
    # that no longer exists and piped it through head, so it passed regardless
    # of the producer's exit status. This job runs a real producer (the client
    # SDK package verifier) under pipefail and fails on any nonzero exit.
    runs-on: ubuntu-latest
    needs: typescript-contract-parity
    defaults:
      run:
        shell: bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install Node dependencies (all workspaces)
        run: npm ci --workspaces
      - name: Build TypeScript contracts
        run: cd contracts && npm run build
      - name: Verify client SDK package contents
        run: cd verdict/client-sdk && npm run verify:package

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every version in requires-python / classifiers is exercised.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,server,dashboard]"
      - name: Run tests
        if: matrix.python-version != '3.13'
        run: pytest tests/ -v --tb=short
      - name: Run tests with coverage
        if: matrix.python-version == '3.13'
        run: pytest tests/ -v --tb=short --cov=verdict --cov-report=xml --cov-fail-under=70
      - name: Validate versioned contract schema
        run: python scripts/validate_contract_schema.py
      - name: Validate public proof matrix and claims ledger
        run: python scripts/verify_proof_matrix.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,server,dashboard]"
      - name: Run Ruff
        run: ruff check .
      - name: Run Ruff Format (check)
        run: ruff format --check .
      - name: Run MyPy
        run: mypy verdict --strict

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        run: uv sync --frozen --extra dev --extra server
      - name: Run Bandit Security Check
        run: uv run bandit -c pyproject.toml -r verdict -ll
      - name: Run dependency audit
        run: uv run pip-audit --local --skip-editable

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,server,dashboard]"
      - name: Run MyPy
        run: mypy verdict --strict

  install-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Minimal install smoke
        run: |
          python -m venv /tmp/verdict-minimal
          /tmp/verdict-minimal/bin/python -m pip install --upgrade pip
          /tmp/verdict-minimal/bin/python -m pip install .
          /tmp/verdict-minimal/bin/verdict --help
          if output=$(/tmp/verdict-minimal/bin/verdict route "format this README" --criticality low --terse --allow-offline 2>&1); then
            echo "expected offline route to fail closed without provider execution"
            exit 1
          fi
          printf '%s\n' "$output" | grep '"transport_outcome": "error"'
      - name: Server extra smoke
        run: |
          python -m venv /tmp/verdict-server
          /tmp/verdict-server/bin/python -m pip install --upgrade pip
          /tmp/verdict-server/bin/python -m pip install ".[server]"
          /tmp/verdict-server/bin/python -c 'from verdict.api import app; assert app is not None'
      - name: Dashboard extra smoke
        run: |
          python -m venv /tmp/verdict-dashboard
          /tmp/verdict-dashboard/bin/python -m pip install --upgrade pip
          /tmp/verdict-dashboard/bin/python -m pip install ".[dashboard]"
          /tmp/verdict-dashboard/bin/python -c 'import importlib.util as u; assert u.find_spec("verdict.dashboard"); import streamlit, plotly, pandas'
      - name: All extras smoke (what `verdict serve` / `verdict dashboard` recommend)
        run: |
          python -m venv /tmp/verdict-all
          /tmp/verdict-all/bin/python -m pip install --upgrade pip
          /tmp/verdict-all/bin/python -m pip install ".[all]"
          /tmp/verdict-all/bin/verdict detect --json
          /tmp/verdict-all/bin/python -c 'from verdict.api import app; assert app is not None; import streamlit, plotly, pandas'
      - name: Complete install smoke
        run: |
          python -m venv /tmp/verdict-complete
          /tmp/verdict-complete/bin/python -m pip install --upgrade pip
          /tmp/verdict-complete/bin/python -m pip install ".[dashboard,dev,server]"
          /tmp/verdict-complete/bin/verdict detect --json
          /tmp/verdict-complete/bin/python - <<'PY'
          from verdict.api import app

          assert app is not None
          PY

  build:
    runs-on: ubuntu-latest
    needs: [test, lint, security, type-check, install-smoke, typescript-contract-parity, client-package-smoke]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine
      - name: Build package
        run: python -m build
      - name: Check package
        run: python -m twine check dist/*
      - name: Wheel install smoke
        run: |
          python -m venv /tmp/verdict-wheel
          /tmp/verdict-wheel/bin/python -m pip install --upgrade pip
          /tmp/verdict-wheel/bin/python -m pip install dist/*.whl
          /tmp/verdict-wheel/bin/verdict --help
          /tmp/verdict-wheel/bin/verdict detect --json
          /tmp/verdict-wheel/bin/verdict quickstart --json --non-interactive --dry-run > /tmp/verdict-wheel-quickstart.json
          /tmp/verdict-wheel/bin/python -c 'import json; from pathlib import Path; report = json.loads(Path("/tmp/verdict-wheel-quickstart.json").read_text()); assert report["decision"]["selected_route"]["runtime_id"] == "demo/frontier-tools"'
      - name: Wheel benchmark smoke (documented commands, no source checkout)
        run: |
          cd /tmp
          /tmp/verdict-wheel/bin/verdict benchmark --output-json /tmp/verdict-wheel-bench.json
          /tmp/verdict-wheel/bin/verdict benchmark --savings --output-json /tmp/verdict-wheel-savings.json
          /tmp/verdict-wheel/bin/python -c 'import json; from pathlib import Path; report = json.loads(Path("/tmp/verdict-wheel-savings.json").read_text()); assert report["aggregate"]["savings_claimed_count"] == 0, report'
      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
