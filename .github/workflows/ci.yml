name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  schedule:
    - cron: '0 3 * * *'  # nightly at 03:00 UTC (full matrix, all checks)

# Cancel stale in-flight runs on the same PR branch on a new push.
# Never cancel main/tag runs (use the unique run_id as the group key instead).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Detect whether the PR touches testable code or only docs/markdown.
  # Non-PR events (main push, nightly) always set code=true.
  #
  # Jobs that ALWAYS run (even on docs-only PRs):
  #   test, test-shard, coverage, lint, security, type-check
  # Jobs SKIPPED on docs-only PRs (source unchanged; output unaffected):
  #   install-smoke, build, typescript-contract-parity, client-package-smoke
  #
  # ci-ok (the single required PR check) uses if:always() and applies
  # per-job rules: required jobs must succeed; skippable jobs may be skipped.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.set.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            code:
              - 'verdict/**'
              - 'tests/**'
              - 'scripts/**'
              - 'contracts/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'setup.cfg'
              - 'setup.py'
              - '.github/workflows/**'
              - 'docs/proof/**'
              - 'openspec/**'
              - 'specs/**'
              - '*.py'
              - '*.toml'
              - '*.cfg'
              - '*.lock'
      - name: Set code output
        id: set
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "code=${{ steps.filter.outputs.code }}" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  typescript-contract-parity:
    # Skipped on docs-only PRs (no TypeScript or Python source changed).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install Node dependencies (all workspaces)
        run: npm ci --workspaces
      - name: Build TypeScript contracts
        run: cd contracts && npm run build
      - name: Run TypeScript contract fixtures
        run: cd contracts && npm test
      - name: Run consumer smoke test
        run: cd contracts && npm run consumer:smoke
      - name: Build TypeScript client SDK
        run: cd verdict/client-sdk && npm run build
      - name: Run TypeScript client SDK tests
        run: cd verdict/client-sdk && npm test

  client-package-smoke:
    # Replaces the former example-smoke-test, which invoked a TypeScript example
    # that no longer exists and piped it through head, so it passed regardless
    # of the producer's exit status. This job runs a real producer (the client
    # SDK package verifier) under pipefail and fails on any nonzero exit.
    # Skipped on docs-only PRs (no TypeScript or Python source changed).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes, typescript-contract-parity]
    if: needs.changes.outputs.code == 'true'
    defaults:
      run:
        shell: bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install Node dependencies (all workspaces)
        run: npm ci --workspaces
      - name: Build TypeScript contracts
        run: cd contracts && npm run build
      - name: Verify client SDK package contents
        run: cd verdict/client-sdk && npm run verify:package

  test:
    # 3.10 on PRs; 3.10/3.11/3.12 on main push and nightly.
    # 3.13 always runs in test-shard (sharded) instead of this job.
    # Always runs: docs changes can break the 110+ test files that read docs/.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ (github.event_name == 'pull_request') && fromJson('["3.10"]') || fromJson('["3.10","3.11","3.12"]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The suite validates docs/proof/dod/*.json, whose merged_sha must be a
          # commit in this repository (scripts/check_dod.py); a depth-1 checkout
          # cannot see the merge commit of an earlier squash-merged PR.
          fetch-depth: 0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,server,dashboard]"
      - name: Run tests
        run: pytest tests/ -n auto --dist loadfile -q --tb=short -o faulthandler_timeout=300 -m "not timing"
      - name: Run wall-clock timing tests serially
        run: pytest tests/ -q --tb=short -m timing -p no:xdist
      - name: Validate versioned contract schema
        run: python scripts/validate_contract_schema.py
      - name: Validate public proof matrix and claims ledger
        run: python scripts/verify_proof_matrix.py

  test-shard:
    # Python 3.13 test suite split into 4 parallel shards via pytest-split.
    # Runs on both PRs and main push (sharding always used for 3.13).
    # Every test runs exactly once; the coverage job verifies the union.
    # Always runs: same reasoning as test — docs changes break tests too.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
        with:
          # Same depth as `test`: check_dod.py validates merged_sha commits.
          fetch-depth: 0
      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,server,dashboard]"
      - name: Run tests (shard ${{ matrix.group }}/4)
        run: |
          pytest tests/ \
            -n auto --dist loadfile \
            -q --tb=short \
            -o faulthandler_timeout=300 \
            -m "not timing" \
            --splits 4 --group ${{ matrix.group }} \
            --cov=verdict --cov-report= \
            -p no:cacheprovider
          mv .coverage .coverage.shard.${{ matrix.group }}
      - name: Run wall-clock timing tests serially (shard 1 only)
        if: matrix.group == 1
        run: pytest tests/ -q --tb=short -m timing -p no:xdist
      - name: Validate versioned contract schema (shard 1 only)
        if: matrix.group == 1
        run: python scripts/validate_contract_schema.py
      - name: Validate public proof matrix and claims ledger (shard 1 only)
        if: matrix.group == 1
        run: python scripts/verify_proof_matrix.py
      - name: Upload coverage shard
        uses: actions/upload-artifact@v7
        with:
          name: coverage-shard-${{ matrix.group }}
          path: .coverage.shard.${{ matrix.group }}
          retention-days: 1
          include-hidden-files: true

  coverage:
    # Combines coverage from all 4 shards, enforces the 70% floor, and verifies
    # that the shard union equals the full test collection (every test ran once).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test-shard]
    if: needs.test-shard.result == 'success'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,server,dashboard]"
      - name: Download coverage artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-shard-*
          merge-multiple: true
      - name: Combine and report coverage
        run: |
          coverage combine .coverage.shard.*
          coverage report --fail-under=70
          coverage xml -o coverage.xml
      - name: Upload combined coverage XML
        uses: actions/upload-artifact@v7
        with:
          name: coverage-combined
          path: coverage.xml
          retention-days: 30
      - name: Verify shard union covers full test collection
        # scripts/ci_shard_union.py uses an in-process pytest plugin to collect
        # exact node IDs; asserts union == full set and shards are pairwise disjoint.
        run: python scripts/ci_shard_union.py --splits 4 --marker "not timing"

  lint:
    # Required check. The pipeline fixes formatting and safe lint fixes itself:
    # on a pull request from this repository it commits `ruff check --fix-only`
    # and `ruff format` to the branch. GitHub creates the pull_request runs for
    # that bot commit in the "action_required" state; this job approves them, so
    # the required checks run on the new head with no agent turn (runs started
    # by workflow_dispatch do not count as pull request checks). If it cannot
    # approve them, the job fails. It then fails only on what is left. Fork
    # pull requests get the strict check without the fix.
    # The definition-of-done, OpenSpec, proof-path and reachability gates run
    # here so that they are part of a required check.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    env:
      AUTOFIX: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
      OPENSPEC_TELEMETRY: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.AUTOFIX == 'true' && github.head_ref || '' }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,server,dashboard]"
      - name: Autofix formatting and safe lint fixes (same-repository pull requests)
        if: env.AUTOFIX == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref }}
        run: |
          ruff check --fix-only --exit-zero .
          ruff format .
          if git diff --quiet; then exit 0; fi
          git config user.name "verdict-autofix"
          git config user.email "verdict-autofix@users.noreply.github.com"
          git commit -qam "style: ruff autofix (pipeline)"
          git push origin "HEAD:$BRANCH"
          head=$(git rev-parse HEAD)
          # GitHub creates the pull_request runs of the fix commit a few seconds
          # apart, queued as "action_required". Approve them until no new run
          # has appeared for two polls in a row.
          approved=0
          quiet=0
          last=-1
          for _ in $(seq 1 30); do
            sleep 10
            for run in $(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$head&status=action_required" --jq '.workflow_runs[].id'); do
              gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$run/approve" >/dev/null
              approved=$((approved + 1))
            done
            seen=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$head&event=pull_request" --jq '.total_count')
            if [ "$seen" -eq "$last" ] && [ "$seen" -gt 0 ]; then quiet=$((quiet + 1)); else quiet=0; fi
            last=$seen
            if [ "$quiet" -ge 2 ]; then break; fi
          done
          if [ "$approved" -eq 0 ]; then
            echo "::error::Pushed ruff fixes as ${head:0:8}, but found no pull_request run to approve; re-run the checks on the new head."
            exit 1
          fi
          echo "::notice::Pushed ruff fixes as ${head:0:8} and approved $approved of its $seen pull_request run(s)."
      - name: Run Ruff
        run: ruff check .
      - name: Run Ruff Format (check)
        run: ruff format --check .
      - name: Run MyPy
        run: mypy verdict --strict
      - name: Find the ratchet base
        id: base
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$PR_BASE" ]; then
            echo "sha=$PR_BASE" >> "$GITHUB_OUTPUT"
          elif [ -n "$PUSH_BEFORE" ] && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            echo "sha=$PUSH_BEFORE" >> "$GITHUB_OUTPUT"
          fi
      - name: Reachability (symbols, orphan modules, forbidden symbols; baselines only shrink)
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            python scripts/check_reachability.py --ratchet-base "$BASE_SHA"
          else
            python scripts/check_reachability.py
          fi
      - name: Definition of done (docs/proof/dod evidence; AGENTS.md)
        run: python scripts/check_dod.py --all
      - name: Claim inventory (every README claim labeled and evidenced)
        run: python scripts/check_claims.py
      - name: Proof paths change only with a Proof trailer and a valid receipt
        if: steps.base.outputs.sha != ''
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: python scripts/check_proof_paths.py --base "$BASE_SHA"
      - name: openspec validate --all --strict (pinned 1.13.2)
        run: npx --yes @fission-ai/openspec@1.13.2 validate --all --strict --no-interactive
      - name: Vendored OpenSpec validator (touched changes)
        if: steps.base.outputs.sha != ''
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: python scripts/check_openspec_vendor.py --base "$BASE_SHA"
      - name: Touched OpenSpec changes have no open tasks (label wip skips)
        if: steps.base.outputs.sha != ''
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          WIP: ${{ contains(github.event.pull_request.labels.*.name, 'wip') }}
        run: |
          if [ "$WIP" = true ]; then
            python scripts/check_openspec_tasks.py --base "$BASE_SHA" --wip
          else
            python scripts/check_openspec_tasks.py --base "$BASE_SHA"
          fi

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Install dependencies
        run: uv sync --frozen --extra dev --extra server
      - name: Run Bandit Security Check
        run: uv run bandit -c pyproject.toml -r verdict -ll
      - name: Run dependency audit
        run: uv run pip-audit --local --skip-editable $(uv run python scripts/security_exceptions.py)

  type-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,server,dashboard]"
      - name: Run MyPy
        run: mypy verdict --strict

  install-smoke:
    # 3.10 and 3.13 on PRs (covers range boundaries); full 3.10-3.13 matrix
    # on main push and nightly (unchanged from the existing gate contract).
    # Skipped on docs-only PRs (no source changed; install behaviour untouched).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ (github.event_name == 'pull_request') && fromJson('["3.10","3.13"]') || fromJson('["3.10","3.11","3.12","3.13"]') }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Minimal install smoke
        run: |
          python -m venv /tmp/verdict-minimal
          /tmp/verdict-minimal/bin/python -m pip install --upgrade pip
          /tmp/verdict-minimal/bin/python -m pip install .
          /tmp/verdict-minimal/bin/verdict --help
          if output=$(/tmp/verdict-minimal/bin/verdict route "format this README" --criticality low --terse --allow-offline 2>&1); then
            echo "expected offline route to fail closed without provider execution"
            exit 1
          fi
          printf '%s\n' "$output" | grep '"transport_outcome": "error"'
      - name: Server extra smoke
        run: |
          python -m venv /tmp/verdict-server
          /tmp/verdict-server/bin/python -m pip install --upgrade pip
          /tmp/verdict-server/bin/python -m pip install ".[server]"
          /tmp/verdict-server/bin/python -c 'from verdict.api import app; assert app is not None'
      - name: Dashboard extra smoke
        run: |
          python -m venv /tmp/verdict-dashboard
          /tmp/verdict-dashboard/bin/python -m pip install --upgrade pip
          /tmp/verdict-dashboard/bin/python -m pip install ".[dashboard]"
          if [ "${{ matrix.python-version }}" = "3.10" ]; then
            /tmp/verdict-dashboard/bin/python -c 'import importlib.util as u; assert u.find_spec("verdict.dashboard"); import plotly, pandas; assert u.find_spec("streamlit") is None'
            if output=$(/tmp/verdict-dashboard/bin/verdict ui 2>&1); then
              echo "expected dashboard to reject Python 3.10"
              exit 1
            else
              test "$?" -eq 1
            fi
            test "$output" = 'The dashboard needs Python 3.11 or newer (streamlit 1.66 and pillow 13 require it); core Verdict works on 3.10.'
          else
            /tmp/verdict-dashboard/bin/python -c 'import importlib.util as u; assert u.find_spec("verdict.dashboard"); import streamlit, plotly, pandas'
          fi
      - name: All extras smoke (what `verdict serve` / `verdict dashboard` recommend)
        run: |
          python -m venv /tmp/verdict-all
          /tmp/verdict-all/bin/python -m pip install --upgrade pip
          /tmp/verdict-all/bin/python -m pip install ".[all]"
          /tmp/verdict-all/bin/verdict detect --json
          if [ "${{ matrix.python-version }}" = "3.10" ]; then
            /tmp/verdict-all/bin/python -c 'from verdict.api import app; assert app is not None'
            /tmp/verdict-all/bin/python -c 'import importlib.util as u; import plotly, pandas; assert u.find_spec("streamlit") is None'
            if output=$(/tmp/verdict-all/bin/verdict ui 2>&1); then
              echo "expected dashboard to reject Python 3.10"
              exit 1
            else
              test "$?" -eq 1
            fi
            test "$output" = 'The dashboard needs Python 3.11 or newer (streamlit 1.66 and pillow 13 require it); core Verdict works on 3.10.'
          else
            /tmp/verdict-all/bin/python -c 'from verdict.api import app; assert app is not None; import streamlit, plotly, pandas'
          fi
      - name: Complete install smoke
        run: |
          python -m venv /tmp/verdict-complete
          /tmp/verdict-complete/bin/python -m pip install --upgrade pip
          /tmp/verdict-complete/bin/python -m pip install ".[dashboard,dev,server]"
          /tmp/verdict-complete/bin/verdict detect --json
          /tmp/verdict-complete/bin/python - <<'PY'
          from verdict.api import app

          assert app is not None
          PY

  build:
    # Skipped on docs-only PRs (no source changed; wheel contents untouched).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Needs only `changes`: it uses no other job's output, and no workflow downloads
    # `dist`. ci-ok still waits for it (tests/test_ci_workflow.py).
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine
      - name: Build package
        run: python -m build
      - name: Check package
        run: python -m twine check dist/*
      - name: Wheel install smoke
        run: |
          python -m venv /tmp/verdict-wheel
          /tmp/verdict-wheel/bin/python -m pip install --upgrade pip
          /tmp/verdict-wheel/bin/python -m pip install dist/*.whl
          /tmp/verdict-wheel/bin/verdict --help
          /tmp/verdict-wheel/bin/verdict detect --json
          /tmp/verdict-wheel/bin/verdict quickstart --json --non-interactive --dry-run > /tmp/verdict-wheel-quickstart.json
          /tmp/verdict-wheel/bin/python -c 'import json; from pathlib import Path; report = json.loads(Path("/tmp/verdict-wheel-quickstart.json").read_text()); assert report["decision"]["selected_route"]["runtime_id"] == "demo/frontier-tools"'
      - name: Wheel benchmark smoke (documented commands, no source checkout)
        run: |
          cd /tmp
          /tmp/verdict-wheel/bin/verdict benchmark --output-json /tmp/verdict-wheel-bench.json
          /tmp/verdict-wheel/bin/verdict benchmark --savings --output-json /tmp/verdict-wheel-savings.json
          /tmp/verdict-wheel/bin/python -c 'import json; from pathlib import Path; report = json.loads(Path("/tmp/verdict-wheel-savings.json").read_text()); assert report["aggregate"]["savings_claimed_count"] == 0, report'
      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  ci-ok:
    # Aggregate gate: the single required check for PRs.
    # Always runs (if: always()). Passes when:
    #   - Required jobs (test, test-shard, coverage, lint, security, type-check)
    #     all have result "success".
    #   - Skippable jobs (install-smoke, build, typescript-contract-parity,
    #     client-package-smoke) have result "success" or "skipped"; any
    #     "failure" or "cancelled" still fails this gate.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [test, test-shard, coverage, lint, security, type-check, install-smoke, build, typescript-contract-parity, client-package-smoke]
    steps:
      - name: Evaluate gate
        env:
          RESULT_TEST: ${{ needs.test.result }}
          RESULT_TEST_SHARD: ${{ needs.test-shard.result }}
          RESULT_COVERAGE: ${{ needs.coverage.result }}
          RESULT_LINT: ${{ needs.lint.result }}
          RESULT_SECURITY: ${{ needs.security.result }}
          RESULT_TYPE_CHECK: ${{ needs.type-check.result }}
          RESULT_INSTALL_SMOKE: ${{ needs.install-smoke.result }}
          RESULT_BUILD: ${{ needs.build.result }}
          RESULT_TS_PARITY: ${{ needs.typescript-contract-parity.result }}
          RESULT_CLIENT_SMOKE: ${{ needs.client-package-smoke.result }}
        run: |
          ok=true
          # Must succeed on every PR (never skip)
          for name_result in \
            "test:$RESULT_TEST" \
            "test-shard:$RESULT_TEST_SHARD" \
            "coverage:$RESULT_COVERAGE" \
            "lint:$RESULT_LINT" \
            "security:$RESULT_SECURITY" \
            "type-check:$RESULT_TYPE_CHECK"
          do
            name="${name_result%%:*}"; result="${name_result#*:}"
            if [ "$result" != "success" ]; then
              echo "FAIL: $name=$result (required; must be success)"; ok=false
            else
              echo "ok:   $name=$result"
            fi
          done
          # May skip on docs-only PRs; failure or cancellation still fails
          for name_result in \
            "install-smoke:$RESULT_INSTALL_SMOKE" \
            "build:$RESULT_BUILD" \
            "typescript-contract-parity:$RESULT_TS_PARITY" \
            "client-package-smoke:$RESULT_CLIENT_SMOKE"
          do
            name="${name_result%%:*}"; result="${name_result#*:}"
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "FAIL: $name=$result (must not fail/cancel; skip OK)"; ok=false
            else
              echo "ok:   $name=$result"
            fi
          done
          if [ "$ok" = false ]; then exit 1; fi
          echo "ci-ok: all required jobs passed"
