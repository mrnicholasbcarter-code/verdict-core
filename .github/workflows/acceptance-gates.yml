name: Acceptance Gates

# The release acceptance gates in ACCEPTANCE_GATES.md, checked against evidence
# this job generates. Tag pushes run it before the release workflow is permitted
# to publish. It also runs on demand and weekly to report current launch readiness.

on:
  workflow_call:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  acceptance-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@v7
        with:
          # The suite validates docs/proof/dod/*.json, whose merged_sha must be a
          # commit in this repository (scripts/check_dod.py); a depth-1 checkout
          # cannot see the merge commit of an earlier squash-merged PR.
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,server,dashboard]"

      - name: Create the evidence directory
        run: rm -rf evidence evidence_bundle && mkdir -p evidence

      # --- Evidence generation ------------------------------------------------
      # Every producer is decisive: a failed command stops the job (bash -euo pipefail).
      # Producers that write text artifacts (.log, .txt) record explicit RESULT: PASS/FAIL
      # outcomes. The verifier is fail-closed: missing RESULT: PASS in a text artifact = FAIL.

      - name: Run the test suite (G1.x-G3.x evidence)
        run: pytest tests/ -q --junitxml=evidence/pytest_results.xml

      - name: Record the benchmark (G6.2 evidence)
        run: python scripts/benchmark.py --output evidence/benchmark_results.json

      # G7.2 is an offline fixture smoke: it shows the demo runs without
      # credentials. It is not evidence that Verdict works on a real gateway;
      # only an acceptance run on the operator host is (AGENTS.md, Definition of done).
      - name: Offline smoke, fixture only (G7.2; not live evidence)
        run: python scripts/flagship_demo.py > evidence/flagship_demo_output.json

      # G7.1 needs an operator-supplied RouteRequest with live offers, which a hosted
      # runner cannot provide. The repository variable VERDICT_ACCEPTANCE_WAIVE_G71
      # (operator waiver for the uncertified 1.0.0 release, 2026-11-19) records a
      # failed quickstart as RESULT: WAIVED instead of stopping the job. The report
      # and the verifier accept WAIVED for G7.1 only, and only while it is "true".
      - name: Record the quickstart (G7.1 evidence)
        env:
          VERDICT_ACCEPTANCE_WAIVE_G71: ${{ vars.VERDICT_ACCEPTANCE_WAIVE_G71 }}
        run: |
          # Explicit, so tee can never mask a quickstart failure whatever the job's shell.
          set -o pipefail
          if python scripts/quickstart.py 2>&1 | tee evidence/quickstart_test.log; then
            exit 0
          elif [ "${VERDICT_ACCEPTANCE_WAIVE_G71:-}" = "true" ]; then
            echo "RESULT: WAIVED (VERDICT_ACCEPTANCE_WAIVE_G71=true; operator waiver)" \
              | tee -a evidence/quickstart_test.log
          else
            exit 1
          fi

      - name: Record the committed-credential scan (G5.4 evidence)
        run: python scripts/scan_committed_credentials.py 2>&1 | tee evidence/secrets_scan_results.txt

      # --- New evidence producers added for BOD-234 ---------------------------

      - name: Copy threat model and privacy policy (G5.1 + G5.2 evidence)
        run: |
          cp THREAT_MODEL.md evidence/THREAT_MODEL.md
          cp PRIVACY_POLICY.md evidence/PRIVACY_POLICY.md

      - name: Set up Node.js (needed for G4.2, G4.3, G4.4)
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Build the contracts package (required by G4.2, G4.3, G4.4)
        run: cd contracts && npm ci && npm run build

      - name: Produce parity evidence (G4.2 + G4.3 evidence)
        run: python scripts/produce_parity_evidence.py --evidence-dir evidence

      - name: Check out verdict-node forwarder suite (G4.4 evidence)
        # Pinned to verdict-node v0.2.0 (tag v0.2.0). Bump when a new verdict-node release ships.
        uses: actions/checkout@v7
        with:
          repository: mrnicholasbcarter-code/verdict-node
          ref: 65feea5f62f9d219ddfaffeb0e6b03e31b987e70
          path: verdict-node

      - name: Install verdict-node dependencies and local contracts (G4.4 evidence)
        run: |
          cd verdict-node
          npm ci
          npm install --no-save ../contracts

      - name: Run the forwarder test suite (G4.4 evidence)
        run: |
          cd verdict-node
          JUNIT_OUTPUT_DIR=$GITHUB_WORKSPACE/evidence npm run test:forwarder:junit

      - name: Produce assignment log evidence (G6.1 evidence)
        run: python scripts/produce_assignment_log_evidence.py --evidence-dir evidence

      - name: Produce README verification evidence (G7.3 evidence)
        run: python scripts/produce_readme_verification.py --evidence-dir evidence

      # --- End new producers --------------------------------------------------

      - name: Build the evidence bundle (G6.3 evidence)
        run: python scripts/evidence_bundle.py --evidence-dir evidence --output-dir evidence_bundle

      # --- Report and verify. Neither of these is advisory. --------------------

      - name: Generate the gate report
        env:
          VERDICT_ACCEPTANCE_WAIVE_G71: ${{ vars.VERDICT_ACCEPTANCE_WAIVE_G71 }}
        run: python scripts/generate_gates_report.py --evidence-dir evidence

      - name: Upload the evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: acceptance-gate-evidence
          path: |
            evidence/
            evidence_bundle/
          retention-days: 30

      - name: Verify the acceptance gates
        env:
          VERDICT_ACCEPTANCE_WAIVE_G71: ${{ vars.VERDICT_ACCEPTANCE_WAIVE_G71 }}
        run: python scripts/verify_gates.py --evidence-dir evidence --json
