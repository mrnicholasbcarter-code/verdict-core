name: Acceptance Gates

# The release acceptance gates in ACCEPTANCE_GATES.md, checked against evidence
# this job generates. Tag pushes run it before the release workflow is permitted
# to publish. It also runs on demand and weekly to report current launch readiness.

on:
  workflow_call:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  acceptance-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,server,dashboard]"

      - name: Create the evidence directory
        run: rm -rf evidence evidence_bundle && mkdir -p evidence

      # --- Evidence generation ------------------------------------------------
      # Every producer is decisive: a failed command stops the job (bash -euo pipefail).
      # Producers that write text artifacts (.log, .txt) record explicit RESULT: PASS/FAIL
      # outcomes. The verifier is fail-closed: missing RESULT: PASS in a text artifact = FAIL.

      - name: Run the test suite (G1.x-G3.x evidence)
        run: pytest tests/ -q --junitxml=evidence/pytest_results.xml

      - name: Record the benchmark (G6.2 evidence)
        run: python scripts/benchmark.py --output evidence/benchmark_results.json

      - name: Record the flagship demo (G7.2 evidence)
        run: python scripts/flagship_demo.py > evidence/flagship_demo_output.json

      - name: Record the quickstart (G7.1 evidence)
        run: python scripts/quickstart.py 2>&1 | tee evidence/quickstart_test.log

      - name: Record the committed-credential scan (G5.4 evidence)
        run: python scripts/scan_committed_credentials.py 2>&1 | tee evidence/secrets_scan_results.txt

      - name: Build the evidence bundle (G6.3 evidence)
        run: python scripts/evidence_bundle.py --evidence-dir evidence --output-dir evidence_bundle

      # --- Report and verify. Neither of these is advisory. --------------------

      - name: Generate the gate report
        run: python scripts/generate_gates_report.py --evidence-dir evidence

      - name: Upload the evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: acceptance-gate-evidence
          path: |
            evidence/
            evidence_bundle/
          retention-days: 30

      - name: Verify the acceptance gates
        run: python scripts/verify_gates.py --evidence-dir evidence --json
