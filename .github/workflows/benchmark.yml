name: Benchmark
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
jobs:
  benchmark:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        run: uv sync --extra dev --extra dashboard --extra server
      - name: Run reproducible local benchmark gate
        run: uv run python benchmarks/run_reproducible.py --output-json benchmark-reproducible.json --fail-on-threshold
      - name: Model selection report (real selector, offline fixture)
        run: uv run python scripts/selection_report.py --output-json benchmark-selection.json --output-md benchmark-selection.md
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: |
            benchmark-reproducible.json
            benchmark-selection.json
            benchmark-selection.md
      - name: Comment benchmark results
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- verdict-benchmark-report -->';
            let body = `${marker}\n## Benchmark\n\n`;
            if (fs.existsSync('benchmark-reproducible.json')) {
              const r = JSON.parse(fs.readFileSync('benchmark-reproducible.json', 'utf8'));
              body += `Reproducible local gate: **${r.metrics.thresholds_passed ? 'passed' : 'failed'}** `
                + `(${r.metrics.sample_count} samples, fixture \`${r.fixture_digest_sha256.slice(0, 12)}\`).\n\n`;
            }
            body += fs.existsSync('benchmark-selection.md')
              ? fs.readFileSync('benchmark-selection.md', 'utf8')
              : 'Selection report did not run.\n';
            body += `\n_Updated for ${context.payload.pull_request.head.sha.slice(0, 7)}._\n`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
