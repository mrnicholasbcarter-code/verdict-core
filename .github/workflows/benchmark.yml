name: Benchmark
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
jobs:
  benchmark:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        run: uv sync --extra dev --extra dashboard --extra server
      - name: Run reproducible local benchmark gate
        run: uv run python benchmarks/run_reproducible.py --output-json benchmark-reproducible.json --fail-on-threshold
      - name: Model selection report (real selector, offline fixture)
        if: always()
        run: uv run python scripts/selection_report.py --output-json benchmark-selection.json --output-md benchmark-selection.md
      - name: Model selection report for the base commit
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE_SHA"
          PYTHONPATH="$RUNNER_TEMP/base" uv run python "$RUNNER_TEMP/base/scripts/selection_report.py" --output-json benchmark-selection-base.json
      - name: Build the pull request comment
        if: always() && github.event_name == 'pull_request'
        run: >-
          uv run python scripts/pr_check_comment.py
          --gate-json benchmark-reproducible.json
          --head-json benchmark-selection.json
          --base-json benchmark-selection-base.json
          --output-md benchmark-comment.md
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: |
            benchmark-reproducible.json
            benchmark-selection.json
            benchmark-selection.md
            benchmark-selection-base.json
            benchmark-comment.md
      - name: Comment only when this pull request changed a result
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- verdict-benchmark-report -->';
            const built = fs.existsSync('benchmark-comment.md');
            const text = built
              ? fs.readFileSync('benchmark-comment.md', 'utf8').trim()
              : 'The check comment could not be built. See the Benchmark job log.';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.includes(marker));
            if (!text) {
              if (existing) {
                await github.rest.issues.deleteComment({ owner, repo, comment_id: existing.id });
              }
              return;
            }
            const pr = context.payload.pull_request;
            const body = `${marker}\n${text}\n\n_Base ${pr.base.sha.slice(0, 7)}, head ${pr.head.sha.slice(0, 7)}._\n`;
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
