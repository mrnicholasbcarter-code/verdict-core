name: Gate drills

# Stays-true check for the "stop false done" gates (AGENTS.md, Definition of
# done): every day, each gate must still fail on its fault and pass on main.

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate-drills:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENSPEC_TELEMETRY: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,server,dashboard]"
      - name: Run the gate drills
        run: python scripts/drill_gates.py --openspec "npx --yes @fission-ai/openspec@1.13.2"
