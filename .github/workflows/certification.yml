name: Release Certification Evidence

# Main pushes retain a source receipt only: no certification checks or rehearsals.
# Manual dispatch can consume main-only independent rehearsal attestations.
# Without a rehearsal run, it retains verified INCOMPLETE evidence only.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rehearsal_run_id:
        description: 'Successful certify-rehearsal.yml run for this exact main SHA (optional)'
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  collect-source-receipt:
    if: github.event_name == 'push'
    name: Retain source receipt (not certification evidence)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash -euo pipefail {0}
    steps:
      - name: Check out the pushed SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record source SHA only
        env:
          EXPECTED_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          mkdir -p artifacts/ci-source-receipts
          printf 'source_sha=%s\nevent=push\nrun_id=%s\nkind=source-receipt-only; no certification checks or rehearsals\n' \
            "$EXPECTED_SHA" "$RUN_ID" > artifacts/ci-source-receipts/receipt.txt
          echo '### Release certification: INCOMPLETE (source receipt only)' >> "$GITHUB_STEP_SUMMARY"
          echo "Source SHA: \`$EXPECTED_SHA\`. No certification checks or clean/chaos rehearsals ran on this push. This is not a certification bundle or gate." >> "$GITHUB_STEP_SUMMARY"
      - name: Retain source receipt (not a certification bundle)
        uses: actions/upload-artifact@v7
        with:
          name: ci-source-receipt-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci-source-receipts/receipt.txt
          if-no-files-found: error
          retention-days: 90

  collect-certification-evidence:
    if: github.event_name == 'workflow_dispatch'
    name: Collect and verify certification evidence
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash -euo pipefail {0}
    steps:
      - name: Check out the exact event SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify checked-out SHA
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Sync locked dependencies
        run: uv sync --frozen --extra dev --extra server
      - name: Download independent rehearsal evidence
        if: inputs.rehearsal_run_id != ''
        uses: actions/download-artifact@v7
        with:
          name: certify-rehearsals-${{ github.sha }}-${{ inputs.rehearsal_run_id }}
          run-id: ${{ inputs.rehearsal_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/attested-rehearsals
      - name: Generate certification evidence
        # Exit 0 is valid only with verified attestations and CERTIFIED verdict.
        # Capture the precise numeric exit code (not just success/failure) so the
        # verifier below can reject a killed/timed-out or crashed run, which also
        # returns nonzero but is not evidence of anything.
        id: generate
        continue-on-error: true
        env:
          REHEARSAL_RUN_ID: ${{ inputs.rehearsal_run_id }}
          REHEARSAL_DIR: ${{ runner.temp }}/attested-rehearsals
        run: |
          rm -rf artifacts/certification
          args=()
          if [ -n "$REHEARSAL_RUN_ID" ]; then
            test "$GITHUB_REF" = refs/heads/main
            [[ "$REHEARSAL_RUN_ID" =~ ^[0-9]+$ ]]
            args=(--attested-rehearsals "$REHEARSAL_DIR")
          fi
          set +e
          timeout --signal=TERM --kill-after=10s 70m \
            .venv/bin/python scripts/certify_release.py "${args[@]}"
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"
      - name: Verify certification evidence
        # An invalid generator result must not be retained as a valid evidence artifact.
        id: verify
        if: ${{ always() }}
        env:
          EXPECTED_SHA: ${{ github.sha }}
          GENERATOR_OUTCOME: ${{ steps.generate.outcome }}
          GENERATOR_EXIT_CODE: ${{ steps.generate.outputs.exit_code }}
          REHEARSAL_RUN_ID: ${{ inputs.rehearsal_run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path

          expected = os.environ['EXPECTED_SHA']
          if not re.fullmatch(r'[0-9a-f]{40}', expected):
              sys.exit('Invalid event SHA')
          actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if actual != expected:
              sys.exit(f'Checkout SHA mismatch: {actual} != {expected}')
          path = Path('artifacts/certification') / expected / 'manifest.json'
          try:
              manifest = json.loads(path.read_text())
          except (OSError, ValueError) as exc:
              sys.exit(f'Missing or invalid certification manifest: {exc}')
          if not isinstance(manifest, dict) or manifest.get('git_sha') != expected:
              sys.exit('Certification manifest SHA mismatch')
          if manifest.get('schema_version') != '1':
              sys.exit('Unsupported certification manifest schema')
          if manifest.get('git_dirty') is not False:
              sys.exit('Certification evidence was produced on a dirty tree')
          attested = bool(os.environ.get('REHEARSAL_RUN_ID'))
          verdict = 'CERTIFIED' if attested else 'INCOMPLETE'
          expected_outcome = 'success' if attested else 'failure'
          if attested and os.environ.get('GITHUB_REF') != 'refs/heads/main':
              sys.exit('Attested certification is main-only')
          if os.environ.get('GENERATOR_OUTCOME') != expected_outcome:
              sys.exit('Unexpected generator outcome: inconsistent with requested verdict')
          exit_code_raw = os.environ.get('GENERATOR_EXIT_CODE', '')
          if not re.fullmatch(r'-?\d+', exit_code_raw):
              sys.exit(f'Missing or non-numeric generator exit code: {exit_code_raw!r}')
          exit_code = int(exit_code_raw)
          if exit_code in (124, 137, 143):
              sys.exit(f'Generator was killed or timed out (exit {exit_code}); not a valid INCOMPLETE result')
          expected_code = 0 if attested else 1
          if exit_code != expected_code:
              sys.exit(f'Generator exited {exit_code}, expected exactly {expected_code} for {verdict} (crash or unexpected exit code)')
          steps = manifest.get('steps')
          required = {'test_clean', 'test_dirty', 'ruff_check', 'ruff_format', 'mypy',
                      'build', 'package_smoke', 'security', 'docs_check', 'git_clean',
                      'rehearsals'}
          if not isinstance(steps, list) or not all(isinstance(s, dict) for s in steps):
              sys.exit('Certification manifest has invalid steps')
          ids = [s.get('step_id') for s in steps]
          if len(ids) != len(required) or set(ids) != required:
              sys.exit('Certification manifest has missing, duplicate or unknown steps')
          if any(s.get('status') not in {'PASS', 'FAIL', 'SKIPPED', 'INCOMPLETE'} for s in steps):
              sys.exit('Certification manifest has invalid step status')
          if any(s['status'] == 'FAIL' for s in steps):
              sys.exit('Certification evidence contains failed steps')
          if any(s['status'] != 'PASS' for s in steps
                 if s['step_id'] not in {'security', 'docs_check', 'rehearsals'}):
              sys.exit('Required certification evidence steps did not pass')
          if next(s for s in steps if s['step_id'] == 'security')['status'] not in {'PASS', 'INCOMPLETE'}:
              sys.exit('Invalid security evidence status')
          if next(s for s in steps if s['step_id'] == 'docs_check')['status'] not in {'PASS', 'SKIPPED'}:
              sys.exit('Invalid docs evidence status')
          rehearsal = next(s for s in steps if s['step_id'] == 'rehearsals')
          if attested:
              if any(s['status'] != 'PASS' for s in steps):
                  sys.exit('Certified evidence requires eleven PASS steps')
              evidence = rehearsal.get('evidence', {})
              if evidence.get('independent_producer_attestation') is not True:
                  sys.exit('Missing independent rehearsal attestation')
              runs = evidence.get('runs')
              if not isinstance(runs, dict) or set(runs) != {'clean', 'chaos'}:
                  sys.exit('Missing clean/chaos attested runs')
              for name, run in runs.items():
                  if (run.get('producer_git_sha') != expected or
                          run.get('attestation', {}).get('source_digest') != expected):
                      sys.exit('Rehearsal attestation SHA mismatch')
          elif rehearsal['status'] != 'SKIPPED':
              sys.exit('Unexpected rehearsal evidence: inspect manually; cannot certify')
          if manifest.get('verdict') != verdict:
              sys.exit(f"Unexpected verdict {manifest.get('verdict')!r}; expected {verdict}")
          for file in ('environment.json', 'CERTIFICATION.md', 'git-clean.txt'):
              if not (path.parent / file).is_file():
                  sys.exit(f'Missing certification bundle file: {file}')
          try:
              environment = json.loads((path.parent / 'environment.json').read_text())
              cert_md = (path.parent / 'CERTIFICATION.md').read_text()
              git_clean = (path.parent / 'git-clean.txt').read_text()
          except (OSError, ValueError) as exc:
              sys.exit(f'Invalid certification bundle file: {exc}')
          if not isinstance(environment, dict) or not isinstance(environment.get('env_var_names'), list):
              sys.exit('Invalid certification environment snapshot')
          if f'**Git SHA**: {expected}' not in cert_md or f'**Verdict**: {verdict}' not in cert_md:
              sys.exit('Certification summary disagrees with manifest')
          if git_clean.strip():
              sys.exit('Certification bundle contains dirty git status')
          # The bundle promises per-step machine-readable reports (BOD-195 deliverable).
          # Require each promised file, parse it, and cross-check it against the
          # manifest so a generator that skips writing real evidence (or writes a
          # report that disagrees with the manifest) is rejected, not silently
          # retained as "verified" evidence.
          manifest_steps = {s['step_id']: s for s in steps}
          report_groups = {
              'test-summary.json': ('test_clean', 'test_dirty'),
              'lint-type-build.json': ('ruff_check', 'ruff_format', 'mypy', 'build'),
              'package-smoke.json': ('package_smoke',),
              'security-summary.json': ('security',),
              'docs-check.json': ('docs_check',),
          }
          for filename, step_ids in report_groups.items():
              report_path = path.parent / filename
              if not report_path.is_file():
                  sys.exit(f'Missing promised machine-readable report: {filename}')
              try:
                  report = json.loads(report_path.read_text())
              except (OSError, ValueError) as exc:
                  sys.exit(f'Invalid machine-readable report {filename}: {exc}')
              if not isinstance(report, dict):
                  sys.exit(f'Machine-readable report {filename} is not a JSON object')
              for step_id in step_ids:
                  entry = report.get(step_id)
                  if not isinstance(entry, dict):
                      sys.exit(f'Machine-readable report {filename} missing entry for step {step_id}')
                  step = manifest_steps[step_id]
                  evidence = step.get('evidence')
                  if not isinstance(evidence, dict):
                      sys.exit(f'Invalid manifest evidence for step {step_id}')
                  if {'status', 'reason'} & evidence.keys():
                      sys.exit(f'Reserved manifest evidence key for step {step_id}')
                  if step['status'] != 'SKIPPED' and not evidence:
                      sys.exit(f'Machine-readable report {filename} has no evidence beyond status for step {step_id}')
                  expected_entry = {'status': step['status'], 'reason': step.get('reason', ''), **evidence}
                  if entry != expected_entry:
                      sys.exit(f'Machine-readable report {filename} disagrees with manifest for step {step_id}')
          summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary:
              with open(summary, 'a', encoding='utf-8') as output:
                  detail = ('GitHub OIDC-attested clean/chaos rehearsals verified.' if attested else
                            'No live clean/chaos rehearsals were collected. '
                            'This artifact is evidence only, not a certification.')
                  output.write(f'### Release certification: {verdict}\n\nSource SHA: `{expected}`. '
                               f'{detail}\n')
          output_path = os.environ.get('GITHUB_OUTPUT')
          if output_path:
              with open(output_path, 'a', encoding='utf-8') as output:
                  output.write(f'artifact_kind={verdict.lower()}\n')
          suffix = 'attested clean/chaos rehearsals' if attested else 'no clean/chaos rehearsals'
          print(f'{verdict}: valid SHA-bound evidence for {expected}; {suffix}')
          PY
      - name: Upload verified SHA-bound evidence
        if: ${{ steps.verify.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: certification-evidence-${{ steps.verify.outputs.artifact_kind }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/certification/${{ github.sha }}/
          if-no-files-found: error
          retention-days: 90
