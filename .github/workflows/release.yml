name: "Release"

on:
  push:
    tags:
      - 'v*'

jobs:
  acceptance:
    permissions:
      contents: read
    uses: ./.github/workflows/acceptance-gates.yml

  release:
    needs: acceptance
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install npm with trusted-publishing support
        run: |
          npm install --global npm@11.5.1
          npm --version | grep -E '^11\.(5\.[1-9]|[6-9]\.|[1-9][0-9]\.)'

      - name: Install Hatch
        run: python -m pip install hatch twine

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies (Python)
        run: uv sync --extra dev --extra dashboard --extra server

      - name: Install dependencies (Node)
        run: npm ci --workspaces

      - name: Verify synchronized release versions
        run: python3 scripts/verify_release_versions.py --tag "$GITHUB_REF_NAME"

      - name: Preflight immutable publication targets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN"
          npm ping
          if npm view "@bodanglin/verdict-contracts@$version" version >/dev/null 2>&1; then
            echo "npm contracts version $version already exists" >&2
            exit 1
          fi
          if npm view "@bodanglin/verdict-client@$version" version >/dev/null 2>&1; then
            echo "npm client version $version already exists" >&2
            exit 1
          fi
          pypi_status="$(curl --silent --output /dev/null --write-out '%{http_code}' "https://pypi.org/pypi/verdict-core/$version/json")"
          if [ "$pypi_status" != "404" ]; then
            echo "PyPI version preflight returned HTTP $pypi_status for $version" >&2
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "GitHub release $GITHUB_REF_NAME already exists" >&2
            exit 1
          fi
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/verdict-core"
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin >/dev/null
          if docker manifest inspect "$image:$version" >/dev/null 2>&1; then
            echo "container image $image:$version already exists" >&2
            exit 1
          fi

      - name: Run Python tests
        run: uv run pytest tests/ --ignore=tests/test_vcr_fallback.py -x -q

      - name: Build TypeScript packages
        run: npm run build --workspaces

      - name: Run TypeScript tests
        run: npm test --workspaces

      - name: Build Python package
        run: hatch build

      - name: Check Python package
        run: twine check dist/*

      - name: Verify installed Python artifacts
        run: python scripts/verify_release_artifacts.py --dist dist

      - name: Attest Python distributions
        id: attest-python
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/

      - name: Stage Python release assets
        run: |
          mkdir -p release-assets
          cp dist/*.whl dist/*.tar.gz release-assets/
          if [ -n "${{ steps.attest-python.outputs.bundle-path }}" ]; then
            cp "${{ steps.attest-python.outputs.bundle-path }}" release-assets/python-distribution-provenance.intoto.jsonl
          fi

      - name: Record provenance evidence
        id: provenance-evidence
        continue-on-error: true
        run: |
          WHEEL_DIGEST=$(sha256sum dist/*.whl | head -1 | awk '{print $1}')
          cat > provenance-evidence.json <<EOF
          {
            "subject_digest": "sha256:${WHEEL_DIGEST}",
            "source_revision": "${{ github.sha }}",
            "build_environment": "github-actions",
            "predicate_type": "https://slsa.dev/provenance/v1",
            "attestation_url": "${{ steps.attest-python.outputs.attestation-url }}"
          }
          EOF

      - name: Upload provenance evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: provenance-evidence
          path: provenance-evidence.json
          retention-days: 30

      - name: Run consumer smoke test
        run: cd contracts && npm run consumer:smoke
      - name: Build and smoke-test the container image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/verdict-core
        run: |
          set -euo pipefail
          image="${IMAGE,,}"
          version="${GITHUB_REF_NAME#v}"
          docker build -t "$image:$version" -t "$image:latest" .
          # The image must run the offline demo to completion with no network before it is pushed.
          docker run --rm --network none "$image:$version" > /tmp/image-demo.txt 2>&1
          grep -Eq '^[0-9]+ +run_finished +outcome=COMPLETE$' /tmp/image-demo.txt
          grep -Fxq '  + VERIFIED  Receipt integrity verified  (receipt:verify)' /tmp/image-demo.txt
          test "$(docker run --rm "$image:$version" --version)" = "verdict-core verdict $version"
          echo "IMAGE_REF=$image" >> "$GITHUB_ENV"
          echo "IMAGE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Build npm release assets
        run: |
          npm pack --workspace @bodanglin/verdict-contracts --pack-destination release-assets
          npm pack --workspace @bodanglin/verdict-client --pack-destination release-assets

      - name: Publish to npm
        if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
        run: |
          npm publish ./release-assets/bodanglin-verdict-contracts-*.tgz --access public --provenance
          npm publish ./release-assets/bodanglin-verdict-client-*.tgz --access public --provenance

      - name: Publish Python package to PyPI
        if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; refusing to mutate it." >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME"

      - name: Publish the container image to GHCR
        if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
        id: push-image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          # Preflight already proved this tag is new; re-check right before the write.
          if docker manifest inspect "$IMAGE_REF:$IMAGE_VERSION" >/dev/null 2>&1; then
            echo "Image $IMAGE_REF:$IMAGE_VERSION already exists; refusing to overwrite it." >&2
            exit 1
          fi
          docker push "$IMAGE_REF:$IMAGE_VERSION"
          docker push "$IMAGE_REF:latest"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE_REF:$IMAGE_VERSION" | cut -d@ -f2)
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest the container image
        if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE_REF }}
          subject-digest: ${{ steps.push-image.outputs.digest }}
          push-to-registry: true

      - name: Record partial-publication recovery guidance
        if: ${{ always() }}
        run: |
          {
            echo "## Release recovery"
            echo "If publication failed after any registry write, stop and follow docs/release-recovery.md."
            echo "Never overwrite an immutable version or blindly rerun this workflow."
          } >> "$GITHUB_STEP_SUMMARY"
