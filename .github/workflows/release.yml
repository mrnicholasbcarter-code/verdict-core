name: "Release"

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: contracts/package-lock.json

      - name: Install Hatch
        run: python -m pip install hatch twine

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies (Python)
        run: uv sync --extra dev --extra dashboard --extra server

      - name: Install dependencies (Node)
        run: npm ci --workspaces

      - name: Run Python tests
        run: uv run pytest tests/ --ignore=tests/test_vcr_fallback.py -x -q

      - name: Run TypeScript tests
        run: npm test --workspaces

      - name: Build Python package
        run: hatch build

      - name: Check Python package
        run: twine check dist/*

      - name: Verify installed Python artifacts
        run: python scripts/verify_release_artifacts.py --dist dist

      - name: Attest Python distributions
        id: attest-python
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/

      - name: Stage Python release assets
        run: |
          mkdir -p release-assets
          cp dist/*.whl dist/*.tar.gz release-assets/
          if [ -n "${{ steps.attest-python.outputs.bundle-path }}" ]; then
            cp "${{ steps.attest-python.outputs.bundle-path }}" release-assets/python-distribution-provenance.intoto.jsonl
          fi

      - name: Build TypeScript packages
        run: npm run build --workspaces

      - name: Verify npm packages
        run: |
          cd contracts && npm pack --dry-run
          cd ../verdict/client-sdk && npm pack --dry-run

      - name: Publish to npm
        if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
        run: |
          cd contracts && npm publish --access public --provenance
          cd ../verdict/client-sdk && npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish Python package to PyPI
        if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; refusing to mutate it." >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
