name: "Release"

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: contracts/package-lock.json

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies (Python)
        run: uv sync --extra dev --extra dashboard --extra server

      - name: Install dependencies (Node)
        run: npm ci --workspaces

      - name: Run Python tests
        run: uv run pytest tests/ --ignore=tests/test_vcr_fallback.py -x -q

      - name: Run TypeScript tests
        run: npm test --workspaces

      - name: Build Python package
        run: uv build

      - name: Check Python package
        run: uv run twine check dist/*

      - name: Build TypeScript packages
        run: npm run build --workspaces

      - name: Verify npm packages
        run: |
          cd contracts && npm pack --dry-run
          cd ../verdict/client-sdk && npm pack --dry-run
          cd ../../verdict-node && npm pack --dry-run

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Publish to npm
        if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
        run: |
          cd contracts && npm publish --access public --provenance
          cd ../verdict/client-sdk && npm publish --access public --provenance
          cd ../../verdict-node && npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
        with:
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
            contracts/*.tgz
            verdict/client-sdk/*.tgz
            verdict-node/*.tgz