name: "Release"

on:
  push:
    tags:
      - 'v*'

# One release at a time, never cancelled midway: two tag pushes cannot race to publish.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  acceptance:
    permissions:
      contents: read
    uses: ./.github/workflows/acceptance-gates.yml

  certification-gate:
    # Only a successful manual certification run can supply a retained bundle.
    # This job is read-only and runs before any publishing or registry preflight.
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Locate exact-SHA certified artifact or warn
        id: locate
        env:
          REQUIRE_CERTIFIED_BUNDLE: ${{ vars.VERDICT_REQUIRE_CERTIFIED_BUNDLE }}
          EXPECTED_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys

          required = os.environ.get('REQUIRE_CERTIFIED_BUNDLE') == 'true'
          if not required:
              warning = ('Release is NOT certification-gated: '
                         'VERDICT_REQUIRE_CERTIFIED_BUNDLE is not true.')
              print(f'::warning::{warning}')
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write(f'### Certification gate\n\n{warning}\n')
              sys.exit(0)
          sha = os.environ['EXPECTED_SHA']
          repository = os.environ['GITHUB_REPOSITORY']
          if not re.fullmatch(r'[0-9a-f]{40}', sha) or not re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+', repository):
              sys.exit('Invalid release SHA or repository')

          def api(endpoint):
              output = subprocess.check_output(['gh', 'api', '--paginate', '--slurp', endpoint], text=True)
              return json.loads(output)

          try:
              runs = api(f'repos/{repository}/actions/workflows/certification.yml/runs?head_sha={sha}&status=success&per_page=100')
              for page in runs:
                  for run in page['workflow_runs']:
                      if (run.get('head_sha') != sha or run.get('event') != 'workflow_dispatch'
                              or run.get('conclusion') != 'success' or run.get('status') != 'completed'):
                          continue
                      run_id = run['id']
                      attempt = run['run_attempt']
                      name = f'certification-evidence-certified-{sha}-{run_id}-{attempt}'
                      artifacts = api(f'repos/{repository}/actions/runs/{run_id}/artifacts?per_page=100')
                      for artifact_page in artifacts:
                          for artifact in artifact_page['artifacts']:
                              if artifact.get('name') == name and artifact.get('expired') is False:
                                  with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
                                      output.write(f'artifact_id={artifact["id"]}\nrun_id={run_id}\nfound=true\n')
                                  sys.exit(0)
          except (OSError, ValueError, KeyError, TypeError, subprocess.CalledProcessError) as exc:
              sys.exit(f'Cannot verify retained certification artifact: {exc}')
          sys.exit(f'No retained certified certification-workflow artifact for release SHA {sha}')
          PY
      - name: Download certified bundle from selected run
        if: steps.locate.outputs.found == 'true'
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.locate.outputs.artifact_id }}
          run-id: ${{ steps.locate.outputs.run_id }}
          github-token: ${{ github.token }}
          path: certification-bundle
      - name: Verify downloaded certified manifest
        if: steps.locate.outputs.found == 'true'
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import sys
          from pathlib import Path

          sha = os.environ['EXPECTED_SHA']
          if not re.fullmatch(r'[0-9a-f]{40}', sha):
              sys.exit('Invalid release SHA')
          path = Path('certification-bundle')
          try:
              manifest = json.loads((path / 'manifest.json').read_text())
              git_clean = (path / 'git-clean.txt').read_text()
          except (OSError, ValueError) as exc:
              sys.exit(f'Missing or invalid certified bundle: {exc}')
          if not isinstance(manifest, dict) or manifest.get('git_sha') != sha:
              sys.exit('Certified bundle SHA does not match release SHA')
          if manifest.get('schema_version') != '1' or manifest.get('verdict') != 'CERTIFIED':
              sys.exit('Bundle does not have a CERTIFIED manifest verdict')
          if manifest.get('git_dirty') is not False or git_clean.strip():
              sys.exit('Certified bundle was not produced on a clean tree')
          steps = manifest.get('steps')
          if not isinstance(steps, list) or len(steps) != 11 or any(
              not isinstance(step, dict) or step.get('status') != 'PASS' for step in steps
          ):
              sys.exit('Certified bundle does not have eleven passing steps')
          ids = {step.get('step_id') for step in steps}
          if ids != {'test_clean', 'test_dirty', 'ruff_check', 'ruff_format', 'mypy',
                     'build', 'package_smoke', 'security', 'docs_check', 'git_clean', 'rehearsals'}:
              sys.exit('Certified bundle has missing or duplicate steps')
          print(f'CERTIFIED bundle for exact release SHA {sha}')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f'### Certification gate\n\nVerified retained CERTIFIED bundle for `{sha}`.\n')
          PY

  release:
    needs: [acceptance, certification-gate]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install npm with trusted-publishing support
        run: |
          npm install --global npm@11.5.1
          npm --version | grep -E '^11\.(5\.[1-9]|[6-9]\.|[1-9][0-9]\.)'

      - name: Install Hatch
        run: python -m pip install hatch twine

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies (Python)
        run: uv sync --extra dev --extra dashboard --extra server

      - name: Install dependencies (Node)
        run: npm ci --workspaces

      - name: Verify synchronized release versions
        run: python3 scripts/verify_release_versions.py --tag "$GITHUB_REF_NAME"

      - name: Preflight immutable publication targets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN"
          npm ping
          if npm view "@bodanglin/verdict-contracts@$version" version >/dev/null 2>&1; then
            echo "npm contracts version $version already exists" >&2
            exit 1
          fi
          if npm view "@bodanglin/verdict-client@$version" version >/dev/null 2>&1; then
            echo "npm client version $version already exists" >&2
            exit 1
          fi
          pypi_status="$(curl --silent --output /dev/null --write-out '%{http_code}' "https://pypi.org/pypi/verdict-core/$version/json")"
          if [ "$pypi_status" != "404" ]; then
            echo "PyPI version preflight returned HTTP $pypi_status for $version" >&2
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "GitHub release $GITHUB_REF_NAME already exists" >&2
            exit 1
          fi
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/verdict-core"
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin >/dev/null
          # Fail closed: only an exact, unmixed "missing manifest" answer counts as absent.
          scripts/image_tag_absent.sh "$image:$version"

      - name: Run Python tests
        run: uv run pytest tests/ --ignore=tests/test_vcr_fallback.py -x -q

      - name: Build TypeScript packages
        run: npm run build --workspaces

      - name: Run TypeScript tests
        run: npm test --workspaces

      - name: Build Python package
        run: hatch build

      - name: Check Python package
        run: twine check dist/*

      - name: Verify installed Python artifacts
        run: python scripts/verify_release_artifacts.py --dist dist

      - name: Attest Python distributions
        id: attest-python
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/

      - name: Stage Python release assets
        run: |
          mkdir -p release-assets
          cp dist/*.whl dist/*.tar.gz release-assets/
          if [ -n "${{ steps.attest-python.outputs.bundle-path }}" ]; then
            cp "${{ steps.attest-python.outputs.bundle-path }}" release-assets/python-distribution-provenance.intoto.jsonl
          fi

      - name: Record provenance evidence
        id: provenance-evidence
        continue-on-error: true
        run: |
          WHEEL_DIGEST=$(sha256sum dist/*.whl | head -1 | awk '{print $1}')
          cat > provenance-evidence.json <<EOF
          {
            "subject_digest": "sha256:${WHEEL_DIGEST}",
            "source_revision": "${{ github.sha }}",
            "build_environment": "github-actions",
            "predicate_type": "https://slsa.dev/provenance/v1",
            "attestation_url": "${{ steps.attest-python.outputs.attestation-url }}"
          }
          EOF

      - name: Upload provenance evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: provenance-evidence
          path: provenance-evidence.json
          retention-days: 30

      - name: Run consumer smoke test
        run: cd contracts && npm run consumer:smoke
      - name: Build and smoke-test the container image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/verdict-core
        run: |
          set -euo pipefail
          image="${IMAGE,,}"
          version="${GITHUB_REF_NAME#v}"
          docker build -t "$image:$version" -t "$image:latest" .
          # The image must run the offline demo to completion with no network before it is pushed.
          docker run --rm --network none "$image:$version" > /tmp/image-demo.txt 2>&1
          grep -Eq '^[0-9]+ +run_finished +outcome=COMPLETE$' /tmp/image-demo.txt
          grep -Fxq '  + VERIFIED  Receipt integrity verified  (receipt:verify)' /tmp/image-demo.txt
          test "$(docker run --rm "$image:$version" --version)" = "verdict-core verdict $version"
          echo "IMAGE_REF=$image" >> "$GITHUB_ENV"
          echo "IMAGE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Build npm release assets
        run: |
          npm pack --workspace @bodanglin/verdict-contracts --pack-destination release-assets
          npm pack --workspace @bodanglin/verdict-client --pack-destination release-assets

      - name: Publish to npm
        if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
        run: |
          npm publish ./release-assets/bodanglin-verdict-contracts-*.tgz --access public --provenance
          npm publish ./release-assets/bodanglin-verdict-client-*.tgz --access public --provenance

      - name: Publish Python package to PyPI
        if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; refusing to mutate it." >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME"

      - name: Publish the container image version tag to GHCR
        if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
        id: push-image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin >/dev/null
          # Re-check right before the write, failing closed on anything but an exact, unmixed
          # "missing manifest" answer. This check and the push are NOT atomic: GHCR has no
          # create-only push, so this only refuses a tag already known to exist. Concurrent
          # release runs are serialized by the workflow's concurrency group, and this workflow
          # is the only publisher; see docs/release-recovery.md for the remaining race.
          scripts/image_tag_absent.sh "$IMAGE_REF:$IMAGE_VERSION"
          # Push only the immutable version tag. The digest comes from this push's own output.
          push_out=$(docker push "$IMAGE_REF:$IMAGE_VERSION" 2>&1)
          printf '%s\n' "$push_out"
          digest=$(printf '%s\n' "$push_out" | grep -Eo 'digest: sha256:[0-9a-f]{64}' | tail -1 | cut -d' ' -f2)
          if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "could not read a sha256 digest from the push of $IMAGE_REF:$IMAGE_VERSION" >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest the container image
        if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE_REF }}
          subject-digest: ${{ steps.push-image.outputs.digest }}
          push-to-registry: true

      - name: Record attested image digest in release notes
        if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          gh release view "$GITHUB_REF_NAME" --json body --jq .body > /tmp/release-notes.md
          {
            printf '\n## Container image\n\n'
            printf 'Versioned image: `%s:%s`\n\n' "$IMAGE_REF" "$IMAGE_VERSION"
            printf 'Attested image digest: `%s@%s`\n' "$IMAGE_REF" "$IMAGE_DIGEST"
          } >> /tmp/release-notes.md
          gh release edit "$GITHUB_REF_NAME" --notes-file /tmp/release-notes.md

      - name: Move the latest tag to the attested image
        if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin >/dev/null
          # Only after the version tag is pushed, attested, and recorded in release notes does :latest move.
          docker push "$IMAGE_REF:latest"

      - name: Record partial-publication recovery guidance
        if: ${{ always() }}
        run: |
          {
            echo "## Release recovery"
            echo "If publication failed after any registry write, stop and follow docs/release-recovery.md."
            echo "Never overwrite an immutable version or blindly rerun this workflow."
          } >> "$GITHUB_STEP_SUMMARY"
