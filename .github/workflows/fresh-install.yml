name: Fresh install transcript

# Evidence job (BOD-216 / BOD-250), run on demand and on PRs that change install.sh: run each published
# one-line install path inside a clean container and keep the full
# transcript as an artifact (ANSI colour codes stripped in the job itself).
# No provider secrets are supplied (checkout uses the runner's GITHUB_TOKEN);
# every path ends in the offline `verdict demo`, which makes no model calls.
on:
  pull_request:
    paths:
      - install.sh
      - .github/workflows/fresh-install.yml
  workflow_dispatch:
    inputs:
      version:
        description: verdict-core version to install (install.sh pins its own default)
        required: false
        default: ""

permissions:
  contents: read

jobs:
  install:
    name: ${{ matrix.path }} on ${{ matrix.image }}
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image: ["python:3.12-slim", "python:3.13-slim"]
        path: ["install.sh", "pipx", "uvx"]
    env:
      NO_COLOR: "1"
      TERM: dumb
      INPUT_VERSION: ${{ inputs.version }}
      MATRIX_PATH: ${{ matrix.path }}
      MATRIX_IMAGE: ${{ matrix.image }}
    steps:
      - name: Base tools (curl, git) in the clean image
        run: |
          set -eu
          apt-get update -qq >/dev/null
          apt-get install -y -qq --no-install-recommends curl ca-certificates git >/dev/null
      - uses: actions/checkout@v7
      - name: Run the ${{ matrix.path }} path and record the transcript
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p transcript
          out="transcript/${MATRIX_PATH}-$(printf '%s' "$MATRIX_IMAGE" | tr ':/' '--').txt"
          ver="$INPUT_VERSION"
          if [ -n "$ver" ] && ! [[ "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "invalid version input: must be N.N.N" >&2; exit 2; fi
          {
            echo "# image: ${MATRIX_IMAGE}"
            echo "# path:  ${MATRIX_PATH}"
            echo "# date:  $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "# commit: ${GITHUB_SHA}"
            echo "# os: $(. /etc/os-release && echo "$PRETTY_NAME")  python: $(python3 --version 2>&1)"
            echo "# user: $(id -un) home: ${HOME}"
            echo "# verdict on PATH before: $(command -v verdict || echo none)"
            echo "# verdict config dirs before: $(ls -d "$HOME/.config/verdict" "$HOME/.verdict" 2>/dev/null || echo none)"
            echo "# credential env vars before (names only): $(env | cut -d= -f1 | grep -E '^(OMNIROUTE_|LLMGATE_|VERDICT_|OPENAI|ANTHROPIC|GEMINI|GOOGLE_API|OPENROUTER)' | sort | tr '\n' ' ' || true)none-listed-above"
            case "$MATRIX_PATH" in
              install.sh)
                python3 -m pip install -q --root-user-action=ignore pipx
                export PATH="$HOME/.local/bin:$PATH"
                echo '$ bash install.sh'
                if [ -n "$ver" ]; then VERDICT_VERSION="$ver" bash install.sh; else bash install.sh; fi
                echo "install.sh exit status: $?"
                ;;
              pipx)
                python3 -m pip install -q --root-user-action=ignore pipx
                export PATH="$HOME/.local/bin:$PATH"
                spec="verdict-core${ver:+==$ver}"
                echo "\$ pipx install $spec"
                pipx install "$spec"
                echo "\$ verdict demo --speed 0"
                verdict demo --speed 0
                echo "verdict demo exit status: $?"
                ;;
              uvx)
                python3 -m pip install -q --root-user-action=ignore uv
                spec="verdict-core${ver:+==$ver}"
                echo "\$ uvx --from $spec verdict demo --speed 0"
                uvx --from "$spec" verdict demo --speed 0
                echo "uvx exit status: $?"
                ;;
            esac
            echo "\$ verdict --version"
            if [ "$MATRIX_PATH" = "uvx" ]; then uvx --from "verdict-core${ver:+==$ver}" verdict --version; else verdict --version; fi
          } 2>&1 | sed -E 's/\x1b\[[0-9;]*m//g' | tee "$out"
          # A completed demo needs the run_finished event AND a verified receipt.
          grep -Eq '^[0-9]+ +run_finished +outcome=COMPLETE$' "$out"
          grep -Fxq '  + VERIFIED  Receipt integrity verified  (receipt:verify)' "$out"
          sha256sum "$out"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fresh-install-${{ matrix.path }}-${{ strategy.job-index }}
          path: transcript/
