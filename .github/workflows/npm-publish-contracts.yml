name: Publish @bodanglin/verdict-contracts to npm

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Actually publish to npm (default: dry-run only)'
        required: false
        type: boolean
        default: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: npm ci --workspaces
      - name: Build TypeScript contracts
        run: cd contracts && npm run build
      - name: Run TypeScript contract tests
        run: cd contracts && npm test
      - name: Run consumer smoke test
        run: cd contracts && npm run consumer:smoke
      - name: Check version not already published
        run: |
          VERSION=$(node -p "require('./contracts/package.json').version")
          if npm view @bodanglin/verdict-contracts@$VERSION version 2>/dev/null; then
            echo "Error: version $VERSION is already published on npm"
            exit 1
          fi
          echo "Version $VERSION is not yet published ✓"
      - name: Verify package contents
        run: cd contracts && npm pack --dry-run
      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: contracts-package
          path: contracts/dist/

  publish:
    needs: build-and-test
    if: inputs.publish == true
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: npm ci --workspaces
      - name: Build TypeScript contracts
        run: cd contracts && npm run build
      - name: Publish to npm
        run: cd contracts && npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # NOTE: CI cannot answer an interactive 2FA prompt.
        # The NPM_TOKEN must be an automation token or granular access token
        # configured to publish without requiring OTP (one-time password).
        # If the token requires OTP, this step will fail with EOTP.
