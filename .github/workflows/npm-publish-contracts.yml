name: Publish @verdict/contracts to npm

on:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: npm ci --workspaces
      - name: Build TypeScript contracts
        run: cd contracts && npm run build
      - name: Run TypeScript contract tests
        run: cd contracts && npm test
      - name: Verify package contents
        run: cd contracts && npm pack --dry-run
      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: contracts-package
          path: contracts/dist/
